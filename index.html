<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>爺爺的拼圖英文課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: a captain's logbook — one narrow reading column; the home page is the book's 30-piece puzzle board, three pieces lit. */
:root{
  --paper:#EEF2EF; --card:#FBFCFA; --ink:#1C2A35; --muted:#5A6A72; --line:#D3DBD6;
  --brass:#946419; --brass-soft:#F1E4CB; --sea:#2D6D6F; --sea-soft:#DCEDEA; --rust:#B0442C; --rust-soft:#F6E0D9;
  --l4:#2F6E9C; --l5:#7D4F9E; --l6:#B5651D; --off:#7A868C;
  --en:"Newsreader", Georgia, "Times New Roman", serif;
  --zh:"PingFang TC","Apple LiGothic Medium","Microsoft JhengHei",sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, "PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181D; --card:#18222A; --ink:#E4EAE7; --muted:#9AA8AE; --line:#2B3840;
  --brass:#D7A955; --brass-soft:#3A2F1C; --sea:#6DBDB8; --sea-soft:#183331; --rust:#E68669; --rust-soft:#3B2219;
  --l4:#7FB6E0; --l5:#C29BE0; --l6:#E7A160; --off:#8D999F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181D; --card:#18222A; --ink:#E4EAE7; --muted:#9AA8AE; --line:#2B3840;
  --brass:#D7A955; --brass-soft:#3A2F1C; --sea:#6DBDB8; --sea-soft:#183331; --rust:#E68669; --rust-soft:#3B2219;
  --l4:#7FB6E0; --l5:#C29BE0; --l6:#E7A160; --off:#8D999F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.en{font-family:var(--en)}
.zh{font-family:var(--zh)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600}
.muted{color:var(--muted)}
/* ---------- home ---------- */
.masthead{padding-block:36px 20px;display:grid;gap:10px}
.masthead h1{font-family:var(--en);font-weight:500;font-size:clamp(30px,6vw,44px);line-height:1.1}
.masthead h1 .zh{display:block;font-family:var(--zh);font-weight:600;font-size:.55em;margin-top:6px;letter-spacing:.04em}
.masthead p{margin:0;max-width:60ch}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-block:22px 10px}
.pc{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--card);display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;min-width:0;
  font-size:11px;line-height:1.25;color:var(--muted);text-align:left;opacity:.62}
.pc b{font-family:var(--en);font-size:15px;font-weight:500;color:var(--muted)}
.pc span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc.on{opacity:1;border-color:var(--brass);background:var(--brass-soft);color:var(--ink)}
.pc.on b{color:var(--brass)}
a.pc.on:hover{transform:translateY(-1px)}
a.pc{text-decoration:none}
.legend{font-size:12.5px;color:var(--muted);margin:0 0 26px}
.units{display:grid;gap:14px}
.ucard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:inherit}
.ucard:hover{border-color:var(--brass)}
.ucard .num{font-family:var(--en);font-size:44px;line-height:1;color:var(--brass);text-align:center;padding-top:4px}
.ucard .num small{display:block;font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.ucard h2{font-family:var(--en);font-weight:500;font-size:22px}
.ucard h2 .zh{font-size:16px;margin-left:8px;color:var(--muted)}
.ucard .idea{font-family:var(--en);font-style:italic;margin:4px 0 8px;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.dist{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);width:100%;margin-top:8px}
.dist i{display:block;height:100%}
.howto{margin-top:30px;padding-block:18px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
/* ---------- unit ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px 0;border-bottom:1px solid var(--line)}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--brass)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px 10px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:600}
.uhead{padding-block:22px 6px;display:grid;gap:8px}
.uhead h1{font-family:var(--en);font-weight:500;font-size:clamp(28px,5vw,38px);line-height:1.15}
.uhead h1 .zh{font-size:.6em;color:var(--muted);margin-left:10px;font-weight:500}
.idea-box{border-left:3px solid var(--brass);padding:4px 0 4px 14px;display:grid;gap:2px}
.idea-box .en{font-style:italic;font-size:18px;line-height:1.45}
.idea-box .zh{font-size:14px;color:var(--muted)}
section.panel{padding-block:16px 8px;display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.key span.k::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:currentColor}
.k4{color:var(--l4)}.k5{color:var(--l5)}.k6{color:var(--l6)}.k0{color:var(--off)}
.para{display:grid;gap:6px;padding-block:4px}
.para .en{font-size:19px;line-height:1.7}
.para.sub .en{font-style:italic;font-size:21px;color:var(--brass)}
.para .zh{font-size:15px;line-height:1.85;color:var(--muted)}
.hide-zh .para .zh{display:none}
.w{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px solid transparent;cursor:pointer;line-height:inherit}
.marks .w.lv4{border-bottom-color:var(--l4)}
.marks .w.lv5{border-bottom-color:var(--l5)}
.marks .w.lv6{border-bottom-color:var(--l6)}
.marks .w.lv0{border-bottom:2px dotted var(--off)}
.marks .w.lvlow{border-bottom:1px solid var(--line)}
.w:hover{background:var(--brass-soft)}
.quote{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.quote .en{font-style:italic;font-size:17.5px;line-height:1.55}
.quote .who{font-size:13px;color:var(--muted)}
/* popover sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.sheet .card{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;display:grid;gap:6px}
.sheet .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet .word{font-family:var(--en);font-size:24px;font-weight:500}
.sheet .x{border:0;background:none;font-size:20px;color:var(--muted);padding:2px 6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-right:6px}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vcard{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;display:grid;gap:4px;min-height:92px;align-content:start}
.vcard .en{font-size:20px;font-weight:500}
.vcard .back{display:grid;gap:5px}
.vcard .back[hidden]{display:none}
.def{font-family:var(--en);font-size:16px;line-height:1.45}
.def::before{content:"EN";font-family:var(--zh);font-size:10.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:2px}
.ex{font-family:var(--en);font-style:italic;font-size:14px;line-height:1.5;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.ex b{font-style:normal;font-weight:600;color:var(--ink)}
.vcard .back .zh{font-size:14px}
.vcard.known{border-color:var(--sea);background:var(--sea-soft)}
.vcard .lvl{font-size:12px}
.offlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:14px;margin:0;padding:0;list-style:none}
.offlist li{padding:4px 0;border-bottom:1px dashed var(--line);min-width:0}
.offlist .en{font-size:16px;margin-right:6px}
.offlist .def{font-size:13.5px;color:var(--muted);margin-top:2px}
.offlist .def::before{display:none}
/* practice */
.score{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--en);font-size:26px;font-weight:500;color:var(--brass)}
.qsec{display:grid;gap:12px}
.qsec h3{font-size:16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qsec h3 small{font-weight:400;color:var(--muted);font-size:13px}
.passage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:17px;line-height:1.75}
.blank{display:inline-block;min-width:2.4em;text-align:center;border-bottom:1.5px solid var(--ink);font-family:var(--ui);font-size:13px;font-weight:600;color:var(--brass);padding:0 4px}
.blank.ok{color:var(--sea);border-color:var(--sea)}
.blank.bad{color:var(--rust);border-color:var(--rust)}
.q{display:grid;gap:8px;padding-block:6px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .stem{font-family:var(--en);font-size:17px}
.q .stem .n{font-family:var(--ui);font-size:13px;color:var(--muted);margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts.long{grid-template-columns:1fr}
.opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;text-align:left;font-family:var(--en);font-size:16px;display:flex;gap:8px}
.opt .L{font-family:var(--ui);font-size:12.5px;color:var(--muted);padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--sea);background:var(--sea-soft)}
.opt.bad{border-color:var(--rust);background:var(--rust-soft)}
.why{font-size:14px;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}
.why.ok{border-left-color:var(--sea)}.why.bad{border-left-color:var(--rust)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-family:var(--en);font-size:16px;margin:0;padding:0;list-style:none}
.bank.sent{grid-template-columns:1fr;font-size:16px}
.bank .L{font-family:var(--ui);font-size:12.5px;color:var(--muted);margin-right:6px}
.picks{display:grid;gap:8px}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pick label{font-size:13px;font-weight:600;color:var(--brass);min-width:3.2em}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select{min-width:0;flex:1 1 200px}
textarea{width:100%;font-family:var(--en);font-size:17px;line-height:1.6}
input[type=text]{flex:1 1 200px;font-family:var(--en);font-size:16px;min-width:0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:7px 14px;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ref{background:var(--sea-soft);border-radius:8px;padding:10px 14px;display:grid;gap:4px}
.ref .en{font-size:17px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats button{border:1px dashed var(--brass);background:var(--card);border-radius:8px;padding:5px 10px;font-family:var(--en);font-size:15px;text-align:left}
.checks{display:grid;gap:4px;font-size:14px}
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;min-width:0}
.step b{font-family:var(--en);font-size:18px;font-weight:500}
.step span{font-size:13px;color:var(--muted)}
.timer{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.timer .t{font-family:var(--en);font-size:34px;font-variant-numeric:tabular-nums;min-width:3.2em}
.sq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.sq .en{font-size:18px}
.sq .start{font-family:var(--en);font-style:italic;color:var(--muted);font-size:15.5px}
@media (max-width:520px){
  .board{grid-template-columns:repeat(5,minmax(0,1fr))}
  .pc span{display:none}
  .method{grid-template-columns:1fr}
  .ucard{grid-template-columns:52px minmax(0,1fr)}
  .ucard .num{font-size:34px}
  .para .en{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>
