<script>
const DATA=[{"id": "age", "piece": 1, "title_en": "Age", "title_zh": "歲月", "idea_en": "Time is an exquisite gift. Everybody ages — so what are you going to do while you’re here?", "idea_zh": "時間是一份精美的禮物。每個人都會老，所以問題是：活著的時候，你要做什麼？", "quote": {"en": "What helps with aging is serious cognition — thinking and understanding. … So the question in life becomes: what are you going to do while you’re here?", "who": "Goldie Hawn (b. 1945), actress"}, "glossary": [{"f": ["exquisite"], "lemma": "exquisite", "pos": "adj.", "zh": "精緻的；極美的", "lv": 0, "en": "extremely beautiful and delicate", "ex": "Grandfather noted that time is an exquisite gift Age is an extremely interesting phenomenon."}, {"f": ["phenomenon"], "lemma": "phenomenon", "pos": "n.", "zh": "現象", "lv": 4, "en": "something that happens or exists and can be observed, often something unusual", "ex": "Grandfather noted that time is an exquisite gift Age is an extremely interesting phenomenon."}, {"f": ["trauma"], "lemma": "trauma", "pos": "n.", "zh": "創傷；悲劇性的經歷", "lv": 5, "en": "a very shocking or painful experience that affects you for a long time", "ex": "Like so much of history, you can talk about it, visit its sites of trauma and battles, but never truly experience it: you just weren’t there."}, {"f": ["surreal"], "lemma": "surreal", "pos": "adj.", "zh": "超現實的；不真實的", "lv": 0, "en": "so strange that it feels like a dream rather than real life", "ex": "When I was young, the aged were distant and surreal."}, {"f": ["ceremony"], "lemma": "ceremony", "pos": "n.", "zh": "儀式；禮節", "lv": 5, "en": "a formal event held to mark an important occasion, such as a wedding or a funeral", "ex": "In a time when a lack of ceremony was slowly “showing its head”"}, {"f": ["formally"], "lemma": "formal", "pos": "adv.", "zh": "正式地", "lv": 2, "en": "(formally) in an official way that follows fixed rules", "ex": "at most non-holiday family dinners, Grandfather always dressed formally."}, {"f": ["etiquette"], "lemma": "etiquette", "pos": "n.", "zh": "禮儀", "lv": 0, "en": "the accepted rules of polite behavior in a society or group", "ex": "Thus a meal with him was a study in proper etiquette and the correct usage of cutlery."}, {"f": ["cutlery"], "lemma": "cutlery", "pos": "n.", "zh": "刀叉餐具", "lv": 0, "en": "knives, forks, and spoons used for eating", "ex": "Thus a meal with him was a study in proper etiquette and the correct usage of cutlery."}, {"f": ["discipline"], "lemma": "discipline", "pos": "n.", "zh": "紀律；自律", "lv": 4, "en": "the ability to control yourself and follow rules, even when it is hard", "ex": "He had been a sea captain and was used to a sense of discipline and order, one could say a severe sense."}, {"f": ["severe"], "lemma": "severe", "pos": "adj.", "zh": "嚴厲的；嚴格的", "lv": 4, "en": "very strict or harsh", "ex": "He had been a sea captain and was used to a sense of discipline and order, one could say a severe sense."}, {"f": ["inconsequential"], "lemma": "inconsequential", "pos": "adj.", "zh": "無關緊要的", "lv": 0, "en": "not important; having little or no effect", "ex": "Things were extremely simple: either you were an individual who gave orders or you were one who received them: the rest of humanity was inconsequential."}, {"f": ["lexicon"], "lemma": "lexicon", "pos": "n.", "zh": "（某人的）詞彙；字典", "lv": 0, "en": "all the words a person knows or uses; a vocabulary", "ex": "who ran away to Europe to paint was not in his lexicon."}, {"f": ["imparted"], "lemma": "impart", "pos": "v.", "zh": "傳授；賦予", "lv": 0, "en": "to pass on knowledge, information, or a quality to someone", "ex": "He imparted this worldview to the automobile, as well."}, {"f": ["violent"], "lemma": "violent", "pos": "adj.", "zh": "猛烈的；暴力的", "lv": 3, "en": "very strong and sudden; using force that can hurt people", "ex": "He drove with the speed of a battleship caught in a violent storm: “Fasten the hatches and full speed ahead.”"}, {"f": ["epoch"], "lemma": "epoch", "pos": "n.", "zh": "時代；紀元", "lv": 0, "en": "a long period of time in history marked by particular events or features", "ex": "This, of course, was an epoch that also distrusted seatbelts: for they could kill you."}, {"f": ["distrusted"], "lemma": "distrust", "pos": "v.", "zh": "不信任", "lv": 0, "base": "trust", "base_lv": 2, "en": "to not believe that someone is honest or reliable", "ex": "This, of course, was an epoch that also distrusted seatbelts: for they could kill you."}, {"f": ["catapulted"], "lemma": "catapult", "pos": "v.", "zh": "（像被彈弓）彈射出去", "lv": 0, "en": "to throw or move someone suddenly and with great force", "ex": "I always imagined his wife being catapulted out of the car right up to the stars: such is the level of adolescent imagination."}, {"f": ["adolescent"], "lemma": "adolescent", "pos": "adj.", "zh": "青少年的", "lv": 5, "en": "relating to the teenage years, between childhood and adulthood", "ex": "I always imagined his wife being catapulted out of the car right up to the stars: such is the level of adolescent imagination."}, {"f": ["diminutive"], "lemma": "diminutive", "pos": "adj.", "zh": "矮小的；嬌小的", "lv": 0, "en": "very small", "ex": "My grandmother was a diminutive woman who controlled my grandfather in an extremely effective way: he loved and idolized her."}, {"f": ["idolized"], "lemma": "idolize", "pos": "v.", "zh": "崇拜；把…當偶像", "lv": 0, "en": "to admire someone so much that you think they are perfect", "ex": "My grandmother was a diminutive woman who controlled my grandfather in an extremely effective way: he loved and idolized her."}, {"f": ["wielded"], "lemma": "wield", "pos": "v.", "zh": "行使（權力）；揮舞", "lv": 0, "en": "to have and use power or influence", "ex": "She therefore wielded enormous control over her household of 13 surviving children, which included my father."}, {"f": ["naively"], "lemma": "naive", "pos": "adv.", "zh": "天真地", "lv": 5, "en": "(naively) in a way that shows too much trust and too little experience", "ex": "For years, I naively thought he was talking about weight training to build your muscles."}, {"f": ["achievement"], "lemma": "achievement", "pos": "n.", "zh": "成就；達成", "lv": 3, "en": "something good that you succeed in doing after a lot of effort", "ex": "In the end, I discovered that he was talking about something far more difficult: the achievement of personal power."}, {"f": ["acquiesce"], "lemma": "acquiesce", "pos": "v.", "zh": "默許；勉強接受", "lv": 0, "en": "to accept or agree to something quietly, without arguing, even if you do not like it", "ex": "You only become old when you finally acquiesce to the changes in your temple: the body."}, {"f": ["physique"], "lemma": "physique", "pos": "n.", "zh": "體格", "lv": 0, "en": "the size and shape of a person's body", "ex": "One would be foolish to claim that a 30-year-old body has the same physique as a 65-year-old one."}, {"f": ["knowledgeable"], "lemma": "knowledgeable", "pos": "adj.", "zh": "知識豐富的", "lv": 6, "en": "knowing a lot about many things or about a particular subject", "ex": "More remarkably, you do feel more knowledgeable in the world and of the world."}, {"f": ["startling"], "lemma": "startle", "pos": "adj.", "zh": "令人吃驚的", "lv": 5, "en": "(startling) very surprising, in a way that makes you stop and notice", "ex": "This leads to the rather startling discovery that you truly know nothing, relative to the corpus of human understanding: this realization is terrifying and yet freeing."}, {"f": ["corpus"], "lemma": "corpus", "pos": "n.", "zh": "（知識、文獻的）全體；總集", "lv": 0, "en": "a complete collection of writings, knowledge, or work", "ex": "This leads to the rather startling discovery that you truly know nothing, relative to the corpus of human understanding: this realization is terrifying and yet freeing."}, {"f": ["realization"], "lemma": "realization", "pos": "n.", "zh": "體認；領悟", "lv": 6, "en": "the moment when you suddenly understand something clearly", "ex": "This leads to the rather startling discovery that you truly know nothing, relative to the corpus of human understanding: this realization is terrifying and yet freeing."}, {"f": ["terrifying"], "lemma": "terrify", "pos": "adj.", "zh": "令人害怕的", "lv": 5, "en": "(terrifying) making you feel extremely afraid", "ex": "This leads to the rather startling discovery that you truly know nothing, relative to the corpus of human understanding: this realization is terrifying and yet freeing."}, {"f": ["enlightenment"], "lemma": "enlightenment", "pos": "n.", "zh": "覺悟；啟蒙", "lv": 6, "en": "a state of deep understanding and wisdom about life", "ex": "You can now swim in the endless lake of knowledge without fear of failure, total enlightenment being only given to Jesus, Buddha, Mohammed or other gifted souls."}, {"f": ["synthesizer"], "lemma": "synthesizer", "pos": "n.", "zh": "綜合者；整合的人", "lv": 0, "en": "a person who brings different ideas or things together into one whole", "ex": "Your task now is to be a synthesizer: to take as much as you can from the world and turn it into a gentler, kinder message."}, {"f": ["compassion"], "lemma": "compassion", "pos": "n.", "zh": "同情心；慈悲", "lv": 5, "en": "a strong feeling of sympathy for people who are suffering, and a wish to help them", "ex": "All they need is some compassion and a slight nudge in the direction of their future."}, {"f": ["nudge"], "lemma": "nudge", "pos": "n.", "zh": "輕推；推一把", "lv": 0, "en": "a small push, either with your body or as gentle encouragement", "ex": "All they need is some compassion and a slight nudge in the direction of their future."}, {"f": ["cognition"], "lemma": "cognition", "pos": "n.", "zh": "認知；思考", "lv": 0, "en": "the mental process of knowing, thinking, and understanding", "ex": "1945) has a thought: What helps with aging is serious cognition -- thinking and understanding."}], "vocab_q": [{"q": "As a former sea captain, Grandfather lived with a strong sense of ______; he got up at five every morning and never left a job unfinished.", "o": ["discipline", "adolescence", "trauma", "imagination"], "a": 0, "x": "discipline 紀律。前面提到他是船長、每天五點起床、事情一定做完，都是「紀律」的表現。"}, {"q": "All that young people need, the author says, is some ______ and a slight nudge in the direction of their future.", "o": ["achievement", "compassion", "ceremony", "trauma"], "a": 1, "x": "compassion 同情心、慈悲。原文：All they need is some compassion and a slight nudge…"}, {"q": "For years, I ______ thought that Grandfather was talking about weight training, but he really meant personal power.", "o": ["naively", "formally", "violently", "severely"], "a": 0, "x": "naively 天真地。後半句說「其實他指的是內在力量」，表示當時的理解太天真。"}, {"q": "The ______ that we know almost nothing compared with all human knowledge is frightening, yet it also sets us free.", "o": ["imagination", "realization", "celebration", "destination"], "a": 1, "x": "realization 體認、領悟。「發現自己幾乎一無所知」是一種領悟。"}], "cloze": {"text": "My grandfather had been a sea captain, and he brought the habits of the ship home with him. Even at an ordinary family dinner, he always dressed __1__. For him, the world was simple: you either gave orders or you __2__ them. He drove his huge car __3__ it were a battleship caught in a storm. He did not trust seatbelts, __4__ he believed they could trap you inside an overturned car.", "items": [{"o": ["formally", "casually", "poorly", "quickly"], "a": 0, "x": "原文說在非節慶的家庭晚餐他「仍盛裝出席」，所以是 formally。"}, {"o": ["refused", "received", "wrote", "invented"], "a": 1, "x": "give orders（下命令）對 receive orders（接受命令）。"}, {"o": ["even if", "as if", "only if", "what if"], "a": 1, "x": "as if + 過去式（were）表示「好像…一樣」的假設語氣。"}, {"o": ["although", "unless", "because", "until"], "a": 2, "x": "後半句說明不信任安全帶的「原因」，用 because。"}]}, "fill": {"text": "When are we supposed to become “old”? The author suspects the answer is “never.” You only become old when you finally __1__ to the changes in your body. Of course, a 65-year-old body is different from a 30-year-old one, but the change is not __2__. In fact, older people often feel more __3__ about the world. Yet they also discover that, __4__ to all human understanding, they know very little. This discovery is __5__, but it is also freeing.", "options": ["complete", "knowledgeable", "give in", "relative", "terrifying", "delicious", "forbidden", "silent"], "a": [2, 0, 1, 3, 4], "x": ["give in to 屈服於、接受；對應原文 acquiesce to。", "原文：there has not been a 100 percent change，所以「不是完全的改變」→ complete。", "feel + 形容詞；原文 you do feel more knowledgeable。", "relative to 相較於；原文 relative to the corpus of human understanding。", "原文：this realization is terrifying and yet freeing。"]}, "structure": {"text": "Age is a strange thing. Like history, you can talk about it and visit the places where it happened, but you cannot truly experience it until you live through it. __1__ They seemed out of place in a world full of beautiful things. Now that the author is nearly 65, he is surprised at how well his life has turned out. __2__ Instead, he feels that there is more to learn than ever. __3__ After all, everybody ages, and there is no turning back the clock.", "options": ["When he was young, old people seemed distant and unreal to him, including his own grandparents.", "He does not feel “old” at all.", "So the real question is what we are going to do while we are here.", "Cars in those days were much bigger than they are today."], "a": [0, 1, 2], "x": ["下一句的 They 指「老人」，所以前面要先出現 old people。", "Instead（反而）前面要先有一個被否定的說法：不覺得自己老。", "最後一句 After all（畢竟）是在說明前一句「真正的問題」的理由。D 是原文細節，但和這段的主題無關。"]}, "reading": [{"q": "What did Grandfather really mean when he said, “The world always respects a strong man”?", "o": ["A man should build his muscles through weight training.", "A person should achieve personal power.", "A man should become a sea captain.", "A person should drive fast and fearlessly."], "a": 1, "x": "第 4 段：In the end, I discovered that he was talking about … the achievement of personal power."}, {"q": "Why did Grandfather distrust seatbelts?", "o": ["They were too expensive.", "He believed they might stop you from escaping an overturned car.", "His wife did not like them.", "Cars at that time were too big for them."], "a": 1, "x": "第 3 段：How could you possibly escape from an overturned car if you were wearing one?"}, {"q": "According to the author, when does a person really become old?", "o": ["At the age of 65.", "When they stop working.", "When they give in to the changes in their body.", "When their grandparents pass away."], "a": 2, "x": "第 5 段：You only become old when you finally acquiesce to the changes in your temple: the body."}, {"q": "How does the author see his task at this stage of life?", "o": ["To take what he can from the world and turn it into a gentler, kinder message.", "To reach total enlightenment.", "To retire and rest.", "To teach young people table manners."], "a": 0, "x": "第 5 段：Your task now is to be a synthesizer: to take as much as you can from the world and turn it into a gentler, kinder message."}], "mixed": [{"q": "Find ONE word in paragraph 4 that means “very small in size.” It describes the author’s grandmother.", "accept": ["diminutive"], "x": "My grandmother was a diminutive woman…"}, {"q": "Fill in TWO words: Before he retired, Grandfather had been a ______ ______.", "accept": ["sea captain"], "x": "He had been a sea captain…"}], "translate": [{"zh": "爺爺曾說，時間是一份精美的禮物。", "ref": ["Grandfather once said that time is an exquisite gift.", "Grandfather once said (that) time is a beautiful/precious gift."], "tip": "「曾說」用過去式 said；that 子句裡講不變的道理，可以用現在式 is。"}, {"zh": "不管我們幾歲，都應該好好運用時間。", "ref": ["No matter how old we are, we should make good use of our time.", "Whatever our age, we should spend our time well."], "tip": "「不管…」用 No matter how…；「好好運用」用 make good use of。"}], "essay": {"prompt_zh": "Leon 的爺爺說：「時間是一份精美的禮物。」請寫一篇英文作文，文分兩段。第一段描述一位你認識的長輩，以及他／她讓你印象深刻的一個習慣或一句話；第二段說明這位長輩如何影響你看待時間或成長的方式。", "materials": ["Time is an exquisite gift.", "He imparted this worldview to me.", "As I became older, I began to respect him more and more.", "There is no turning back the clock.", "The question becomes: what am I going to do while I’m here?"]}, "speak": [{"q": "Think of an older person in your family. What is one habit of theirs that you did not understand as a child, but understand now?", "start": "One thing my ___ always does is… When I was a child, I thought…, but now I realize…"}, {"q": "Grandfather believed you either give orders or receive them. Do you agree? Why or why not?", "start": "I (don’t) agree, because… For example, …"}, {"q": "If time is a gift, how do you want to spend this year?", "start": "This year, I want to… because… The first step I will take is…"}], "stats": {"words": 689, "dist": {"0": 5.1, "1": 78.8, "2": 9.7, "3": 2.6, "4": 2.1, "5": 1.2, "6": 0.5}}, "paras": [{"en": "Grandfather noted that time is an exquisite gift", "zh": "爺爺曾說時間是個精美的禮物。"}, {"en": "Age is an extremely interesting phenomenon. Like so much of history, you can talk about it, visit its sites of trauma and battles, but never truly experience it: you just weren’t there. So it is with time. You can hear its descriptions and attempt to create its images, but this is mostly nonsensical until you live through it. When I was young, the aged were distant and surreal. They appeared oddly out of place in a world filled with beautiful things. This included my grandparents.", "zh": "歲月是個非常有趣的現象。就好比很多歷史事件，我們可以討論它，甚至去參觀悲劇與戰爭發生的地點，但我們從來無法實際去體驗它。我們對時間的體驗也是如此的，別人在訴說他的人生故事時，你可以試圖在腦海中描繪出那時的影像，但在你還沒真正經歷之前，這些想像沒有太大的意義。年輕時，年老的長輩對我來說是遙遠而且不真實的，他們與這個美麗的世界顯得格格不入，而我的祖父母也是如此。"}, {"en": "In a time when a lack of ceremony was slowly “showing its head” at most non-holiday family dinners, Grandfather always dressed formally. Thus a meal with him was a study in proper etiquette and the correct usage of cutlery. He had been a sea captain and was used to a sense of discipline and order, one could say a severe sense. I always remember his command of the world. Things were extremely simple: either you were an individual who gave orders or you were one who received them: the rest of humanity was inconsequential. The “free spirit” who ran away to Europe to paint was not in his lexicon. He imparted this worldview to the automobile, as well. A car was to be controlled and directed, not driven. He drove with the speed of a battleship caught in a violent storm: “Fasten the hatches and full speed ahead.”", "zh": "在這個儀式逐漸消逝的時代，爺爺在非節慶時的家庭晚餐中仍是盛裝出席。因此，與爺爺一起吃飯就像在學習用餐的禮儀以及如何使用刀叉。他曾是一位船長，習慣了紀律與秩序的生活，而且十分嚴格地奉行。我永遠記得他的世界觀，對他而言，凡事都能用極為簡化的方式分類：你不是發號司令的人，就是按照命令行事的人。其他人不屬於這種分類方式的人便不是他關注的對象。他的字典中沒有「不羈的靈魂」這個詞，他無法理解為何有人會遠赴歐洲畫畫。他也將這樣的世界觀套用到開車上。他認為，車子不是拿來讓人開的，而是讓人控制與指揮的。他開車的速度有如在暴風雨中航行於海上的戰艦：「關緊艙門，全速前進。」"}, {"en": "It is to be remembered that the vehicles of this era were huge in comparison to our modern age. This, of course, was an epoch that also distrusted seatbelts: for they could kill you. How could you possibly escape from an overturned car if you were wearing one? I always imagined his wife being catapulted out of the car right up to the stars: such is the level of adolescent imagination.", "zh": "不得不提的是，爺爺那個年代的車與現代的車相比大多了。那年代的人不信任安全帶，他們認為繫安全帶反而會讓你喪命，因為如果翻車了，你怎可能在繫著安全帶的情況下逃出車外？我總會在腦中想像他太太被拋出車外並被甩到天上的情景。沒辦法，青少年的想像力就是這麼豐富。"}, {"en": "My grandmother was a diminutive woman who controlled my grandfather in an extremely effective way: he loved and idolized her. She therefore wielded enormous control over her household of 13 surviving children, which included my father. As I became older, I began to respect Grandfather more and more. He said to me just before he died, “Remember Leon, the world always respects a strong man.” For years, I naively thought he was talking about weight training to build your muscles. In the end, I discovered that he was talking about something far more difficult: the achievement of personal power.", "zh": "我的奶奶看似矮小，卻能夠牢牢地掌控我爺爺，讓他對她又愛又敬。奶奶也因此對於她13個平安長大的小孩有極大的掌控權，對我爸也不例外。長大一點之後，我開始越來越尊敬爺爺。他在去世前不久告訴我：「利昂，要記住，只有強壯的男人才會為世人所尊敬。」多年來，我天真地以為他所說的「強壯」是指透過重訓來練肌肉。我後來才發現他所說的「強壯」有更深邃的內涵，是指個人內在力量的展現。"}, {"en": "Now that I find myself approaching 65, I am more than a little surprised at how well it has all worked out. Firstly, I don’t feel “old.” When is this disease called age supposed to begin? I suspect that the answer is “never.” You only become old when you finally acquiesce to the changes in your temple: the body. One would be foolish to claim that a 30-year-old body has the same physique as a 65-year-old one. That being said, there has not been a 100 percent change. More remarkably, you do feel more knowledgeable in the world and of the world. This leads to the rather startling discovery that you truly know nothing, relative to the corpus of human understanding: this realization is terrifying and yet freeing. You can now swim in the endless lake of knowledge without fear of failure, total enlightenment being only given to Jesus, Buddha, Mohammed or other gifted souls. Your task now is to be a synthesizer: to take as much as you can from the world and turn it into a gentler, kinder message. I teach many, many young people. They are filled with energy and excitement. All they need is some compassion and a slight nudge in the direction of their future. And, they must be continuously reminded, whatever the age, to spend their time well. The great actress Goldie Hawn (b. 1945) has a thought: What helps with aging is serious cognition -- thinking and understanding. You have to truly grasp that everybody ages. Everybody dies. There is no turning back the clock. So the question in life becomes: what are you going to do while you're here?", "zh": "我現在快65歲了，很驚訝我人生過得不錯。首先，我並不覺得自己老。老化這個「疾病」應該是什麼時候開始的呢？我認為，老化「沒有」真正開始的一刻，只有在你最終接受自己身體的變化時，你才真的開始變老。當然我們不用想也知道30歲和60歲時的體格不會一樣，但老化也不是讓你變成一個截然不同的人。令人訝異的是，你確實會覺得自己的知識與見識日益增長，但接著你會驚覺，與人類所知的一切相比，你所知道的不過是滄海一粟罷了。這樣的覺悟讓人害怕，卻也讓人鬆一口氣。現在你可以在漫無邊際的知識海中徜徉，而不必害怕所學到的知識有所不足，因為只有耶穌、佛陀、穆罕默德或其他天資聰穎的人才能真正達到徹底的覺悟。你現在的任務就是把自己當成一個合成器，盡可能地吸收新知，並將其轉化成正向的訊息。我有很多年輕的學生，他們活力充沛、充滿朝氣，就差一點同情心和人生方向的指路人。此外，他們也經常需要他人提醒，無論幾歲都應該好好運用時間。知名女演員歌蒂．韓認為：「在老化的過程中，多訓練思考力與理解力對你是有幫助的，你必須真的體認到沒有人能躲得掉老化和死亡，時光是不會倒流的。因此，我們這一生要思考的就是：活著的時候要做什麼呢？」"}]}, {"id": "gratitude", "piece": 2, "title_en": "Gratitude", "title_zh": "感恩", "idea_en": "The really powerful people are the most modest and the most thankful.", "idea_zh": "真正有力量的人，最謙虛，也最懂得感恩。", "quote": {"en": "One looks back with appreciation to the brilliant teachers, but with gratitude to those who touched our human feelings.", "who": "Carl Jung (1875–1961), psychiatrist"}, "glossary": [{"f": ["modest"], "lemma": "modest", "pos": "adj.", "zh": "謙虛的", "lv": 4, "en": "not proud; not trying to show off your power or success", "ex": "Grandfather remarked that the really powerful people are the most modest and the most thankful."}, {"f": ["humbled"], "lemma": "humble", "pos": "adj.", "zh": "（感到）謙卑的、自覺渺小的", "lv": 2, "en": "(humbled) feeling less important because something is much greater than you", "ex": "I often feel totally humbled in the face of the experience of other people."}, {"f": ["educators"], "lemma": "educator", "pos": "n.", "zh": "教育工作者", "lv": 0, "base": "educate", "base_lv": 3, "en": "a person whose job is to teach; a teacher", "ex": "The other day, I had the opportunity to have lunch with a group of educators."}, {"f": ["diverse"], "lemma": "diverse", "pos": "adj.", "zh": "多樣的；各式各樣的", "lv": 4, "en": "including many different kinds of people or things", "ex": "They were a diverse lot and included a math teacher, a violin teacher, an English teacher, etc."}, {"f": ["volunteered"], "lemma": "volunteer", "pos": "v.", "zh": "自願服務；當志工", "lv": 4, "en": "to offer to do something without being forced or paid", "ex": "She had recently volunteered at the Missionaries of Charity in Calcutta."}, {"f": ["founder"], "lemma": "founder", "pos": "n.", "zh": "創辦人", "lv": 4, "en": "a person who starts an organization, a company, or a school", "ex": "Mother Teresa (1910-1997) was the founder and the driving force behind its worldwide expansion."}, {"f": ["expansion"], "lemma": "expansion", "pos": "n.", "zh": "擴張；發展", "lv": 4, "en": "the process of growing larger or spreading to more places", "ex": "Mother Teresa (1910-1997) was the founder and the driving force behind its worldwide expansion."}, {"f": ["gratitude"], "lemma": "gratitude", "pos": "n.", "zh": "感激；感恩", "lv": 4, "en": "the feeling of being thankful", "ex": "The young woman in the restaurant expressed great gratitude that she had had the opportunity to go and actually give of her time and her energy in the service of others."}, {"f": ["unconditional", "unconditionally"], "lemma": "unconditional", "pos": "adj.", "zh": "無條件的", "lv": 6, "en": "complete, without any limits or conditions", "ex": "This giving is unique because to be pure, it must be unconditional: it asks for nothing in return."}, {"f": ["apprises"], "lemma": "apprise", "pos": "v.", "zh": "告知；通知", "lv": 0, "en": "to tell someone about something; to inform", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["chronic"], "lemma": "chronic", "pos": "adj.", "zh": "慢性的；長期的", "lv": 5, "en": "lasting for a long time or happening again and again", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["fatal"], "lemma": "fatal", "pos": "adj.", "zh": "致命的", "lv": 4, "en": "causing death", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["malady"], "lemma": "malady", "pos": "n.", "zh": "疾病；弊病", "lv": 0, "en": "an illness or disease; something wrong in a person or society", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["psychological"], "lemma": "psychological", "pos": "adj.", "zh": "心理的", "lv": 4, "en": "relating to the mind and feelings", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["isolation"], "lemma": "isolation", "pos": "n.", "zh": "孤立；孤寂", "lv": 4, "en": "the state of being alone or separated from other people", "ex": "As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"f": ["rejected"], "lemma": "reject", "pos": "adj.", "zh": "被拒絕的；被冷落的", "lv": 2, "en": "(rejected) feeling unwanted or unloved by other people", "ex": "Many people feel alone and rejected because they experience being unloved."}, {"f": ["sleek"], "lemma": "sleek", "pos": "adj.", "zh": "線條流暢的；時髦的", "lv": 0, "en": "smooth, stylish, and modern-looking", "ex": "We can pursue material wealth, purchase a large house or a sleek sports car, but this does not alter our isolation."}, {"f": ["alter"], "lemma": "alter", "pos": "v.", "zh": "改變", "lv": 5, "en": "to change something", "ex": "We can pursue material wealth, purchase a large house or a sleek sports car, but this does not alter our isolation."}, {"f": ["poverty"], "lemma": "poverty", "pos": "n.", "zh": "貧窮；匱乏", "lv": 3, "en": "the state of being very poor", "ex": "She tells us that this is a unique type of poverty, a poverty of spirituality -- a poverty of the soul if you will."}, {"f": ["spirituality"], "lemma": "spirituality", "pos": "n.", "zh": "靈性；精神層面", "lv": 0, "base": "spiritual", "base_lv": 4, "en": "the part of life concerned with the soul, deep values, and meaning, rather than material things", "ex": "She tells us that this is a unique type of poverty, a poverty of spirituality -- a poverty of the soul if you will."}, {"f": ["inclined"], "lemma": "incline", "pos": "adj.", "zh": "傾向於…的；願意…的", "lv": 6, "en": "(inclined) wanting to do something, or likely to do it", "ex": "In the East, people are much more inclined to accept the art of conversation and the value of spending time with family and friends."}, {"f": ["radically"], "lemma": "radical", "pos": "adv.", "zh": "根本地；徹底地", "lv": 5, "en": "(radically) completely; in a very basic and important way", "ex": "This is a radically different concept relative to the value of life in the West."}, {"f": ["unconsciously"], "lemma": "unconsciously", "pos": "adv.", "zh": "無意識地；不自覺地", "lv": 0, "base": "conscious", "base_lv": 3, "en": "without knowing or noticing that you are doing it", "ex": "1948), the Canadian/German philosopher, remarks: “Most humans are never fully present in the now, because unconsciously they believe that the next moment must be more important than this one."}, {"f": ["appreciation"], "lemma": "appreciation", "pos": "n.", "zh": "欣賞；感激", "lv": 4, "en": "the feeling of being thankful for something; understanding how good something is", "ex": "An appreciation of just being alive, the “I think and therefore I am”"}, {"f": ["inextricably"], "lemma": "inextricably", "pos": "adv.", "zh": "密不可分地", "lv": 0, "en": "in a way that cannot be separated", "ex": "of Rene Descartes (1596-1650), and your deep love for the people around you means that these two concepts are inextricably linked: both are unconditional."}, {"f": ["embraces"], "lemma": "embrace", "pos": "v.", "zh": "擁抱", "lv": 5, "en": "to hold someone close in your arms; also, to accept something fully and willingly", "ex": "When your mother embraces you, she is grateful that you have grown into a healthy and vibrant human being, she is not (or should not be) expecting something in return."}, {"f": ["vibrant"], "lemma": "vibrant", "pos": "adj.", "zh": "充滿活力的", "lv": 0, "en": "full of energy, life, and bright color", "ex": "When your mother embraces you, she is grateful that you have grown into a healthy and vibrant human being, she is not (or should not be) expecting something in return."}, {"f": ["contemplate"], "lemma": "contemplate", "pos": "v.", "zh": "沉思；凝視", "lv": 5, "en": "to look at something or think about it carefully and quietly for a long time", "ex": "Sit in a quiet place and focus on your breathing, empty your mind and contemplate the moment."}, {"f": ["uncorrupted"], "lemma": "uncorrupted", "pos": "adj.", "zh": "未受干擾的；純淨的", "lv": 0, "base": "corrupt", "base_lv": 5, "en": "pure; not damaged or spoiled by bad influences", "ex": "When I initially tried this, of my 60 seconds, only 15 were actually free and uncorrupted with other thoughts."}, {"f": ["acknowledge"], "lemma": "acknowledge", "pos": "v.", "zh": "承認；認可", "lv": 0, "en": "to accept or admit that something is true or important", "ex": "I believe that to really be grateful, I must acknowledge that I am unique and I have special gifts to give the world."}, {"f": ["wage slave"], "lemma": "wage slave", "pos": "n.", "zh": "薪水的奴隸", "lv": 0, "en": "a person who depends completely on a job they do not enjoy, just to earn money", "ex": "With this, I ought to come to the realization that I am not a wage slave if I do not want to be."}, {"f": ["intellectual"], "lemma": "intellectual", "pos": "adj.", "zh": "智力的；動腦的", "lv": 4, "en": "relating to thinking and understanding, using the mind", "ex": "Work is a concept about extending yourself away from yourself on some type of concrete project: that could be intellectual work or physical work."}, {"f": ["tragic"], "lemma": "tragic", "pos": "adj.", "zh": "悲慘的；可悲的", "lv": 4, "en": "very sad, especially because it involves suffering or loss", "ex": "And I ask myself, because I'm an old man now, \"Do I want to live a good-enough life?\" And if the answer is \"yes,\" tragic!"}, {"f": ["psychiatrist"], "lemma": "psychiatrist", "pos": "n.", "zh": "精神科醫師", "lv": 0, "en": "a medical doctor who treats mental illness", "ex": "The great psychiatrist and philosopher Carl Jung (1875-1961) has a thought: One looks back with appreciation to the brilliant teachers, but with gratitude to those who touched our human feelings."}, {"f": ["curriculum"], "lemma": "curriculum", "pos": "n.", "zh": "課程", "lv": 5, "en": "all the subjects and lessons taught in a school or course", "ex": "The curriculum is so much necessary raw material, but warmth is the vital element for the growing plant and for the soul of the child."}, {"f": ["vital"], "lemma": "vital", "pos": "adj.", "zh": "極重要的；生命所需的", "lv": 4, "en": "extremely important and necessary", "ex": "The curriculum is so much necessary raw material, but warmth is the vital element for the growing plant and for the soul of the child."}], "vocab_q": [{"q": "She had volunteered in Calcutta, and she felt deeply ______ for the chance to serve others.", "o": ["grateful", "jealous", "chronic", "radical"], "a": 0, "x": "grateful 感激的。原文：expressed great gratitude that she had had the opportunity…"}, {"q": "Mother Teresa believed that the greatest disease in the Western world is not a physical illness but psychological ______.", "o": ["isolation", "expansion", "celebration", "admission"], "a": 0, "x": "isolation 孤立、孤寂。原文：it is psychological isolation。"}, {"q": "A mother’s love is ______; she does not expect anything in return.", "o": ["unconditional", "unbelievable", "uncomfortable", "unfortunate"], "a": 0, "x": "unconditional 無條件的。後半句「不期待回報」就是無條件。"}, {"q": "Sit in a quiet place, focus on your breathing, empty your mind, and ______ the moment.", "o": ["contemplate", "purchase", "reject", "alter"], "a": 0, "x": "contemplate 沉思、靜觀。原文：empty your mind and contemplate the moment。"}], "cloze": {"text": "The author once had lunch with a group of teachers. One of them, an English teacher, had recently __1__ at the Missionaries of Charity in Calcutta. She was thankful not for what she received, but for what she was able to __2__. Mother Teresa believed that many people in rich countries feel alone and unloved. Buying a big house or a fast car does not __3__ this feeling. It is a kind of poverty, __4__ not of money but of the soul.", "items": [{"o": ["volunteered", "retired", "graduated", "complained"], "a": 0, "x": "到仁愛傳教女修會「當志工」→ volunteered。"}, {"o": ["give", "take", "borrow", "forget"], "a": 0, "x": "not for what she received, but for what she was able to give，received 和 give 對比。"}, {"o": ["change", "cause", "share", "prove"], "a": 0, "x": "買房買車「不會改變」孤單的感覺；原文 this does not alter our isolation。"}, {"o": ["one", "that", "it", "what"], "a": 0, "x": "one 代替前面的 a kind of poverty，當同位語：a poverty, one not of money…"}]}, "fill": {"text": "Gratitude is not easy to __1__, because we often live in the past or in the future. Gratitude, __2__, requires us to live in the present. Eckhart Tolle says that most people are never fully present, because they __3__ believe that the next moment is more important than this one. Try this __4__: sit in a quiet place for 60 seconds and focus only on your breathing. When the author first tried it, only 15 of his 60 seconds were free of other thoughts. It __5__ practice.", "options": ["practice", "however", "unconsciously", "experiment", "requires", "borrow", "loudly", "seldom"], "a": [0, 1, 2, 3, 4], "x": ["be easy to + 原形動詞；練習感恩不容易。", "前面說我們活在過去或未來，這裡轉折說感恩需要活在當下 → however。", "原文：unconsciously they believe that the next moment must be more important…", "Try this experiment 試試這個實驗；原文用的就是 experiment。", "It requires practice 這需要練習；主詞 It 是第三人稱單數，所以用 requires。"]}, "structure": {"text": "The author believes that to be truly grateful, he must accept that he is unique and has special gifts to give the world. __1__ Whatever work we choose, it can be intellectual or physical. __2__ If we do something only halfway, we damage ourselves. Now that he is old, the author asks himself whether he wants to live a “good-enough” life. __3__", "options": ["This means he does not have to be a wage slave unless he wants to be.", "But our effort must be 100 percent, or the job should not be done at all.", "If the answer is yes, that would be tragic.", "The violin teacher at the lunch was very quiet."], "a": [0, 1, 2], "x": ["接在「我有獨特的天賦」後面，推出「所以不必當薪水的奴隸」。", "下一句 If we do something only halfway 呼應「要全力以赴」。", "前一句是問句「想不想過差不多的人生」，接著回答「如果答案是想，那就可悲了」。"]}, "reading": [{"q": "What is the main idea of this chapter?", "o": ["Gratitude grows when we give without expecting anything back and live in the present.", "Teachers in the East are better than teachers in the West.", "Material wealth is the best cure for loneliness.", "Meditation is easy for most people."], "a": 0, "x": "全篇圍繞「無條件的付出」與「活在當下」兩個感恩的條件。"}, {"q": "According to Mother Teresa, what is the greatest disease in the Western world?", "o": ["A chronic physical illness.", "Psychological isolation.", "A lack of money.", "Working too hard."], "a": 1, "x": "第 3 段：the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation."}, {"q": "What happened when the author first tried the 60-second experiment?", "o": ["He stayed focused for all 60 seconds.", "Only 15 seconds were free of other thoughts.", "He fell asleep.", "He gave up after 15 seconds."], "a": 1, "x": "第 5 段：of my 60 seconds, only 15 were actually free and uncorrupted with other thoughts."}, {"q": "What does Carl Jung’s quote at the end suggest?", "o": ["We feel the deepest gratitude toward teachers who touched our feelings.", "The curriculum is the most important part of school.", "Brilliant teachers are soon forgotten.", "Children learn best from plants."], "a": 0, "x": "Jung 說對優秀的老師是 appreciation，對觸動我們內心的老師才是 gratitude；溫暖才是孩子心靈成長的關鍵。"}], "mixed": [{"q": "Find ONE word in the opening line that means “not proud; not talking much about your own abilities.”", "accept": ["modest"], "x": "the really powerful people are the most modest and the most thankful."}, {"q": "Fill in the blank (a hyphenated phrase): The author does not want to live a ______ life.", "accept": ["good-enough", "good enough"], "x": "Do I want to live a good-enough life?"}], "translate": [{"zh": "真正有力量的人，往往最謙虛，也最懂得感恩。", "ref": ["Truly powerful people are often the most modest and the most grateful.", "The really powerful people are usually the most modest and the most thankful."], "tip": "「最…」用 the most + 形容詞；「懂得感恩」可以用 grateful 或 thankful。"}, {"zh": "我們常常活在過去或未來，而不是活在當下。", "ref": ["We often live in the past or in the future instead of in the present.", "We often live in the past or the future rather than in the now."], "tip": "「而不是」用 instead of 或 rather than；「當下」是 the present。"}], "essay": {"prompt_zh": "請寫一篇英文作文，文分兩段。第一段描述一位你想感謝的人，以及他／她為你做過的一件事；第二段說明你打算如何表達你的感謝，以及「感恩」對你的意義。", "materials": ["I often feel totally humbled by…", "She asked for nothing in return.", "When you give love unconditionally, you are simply grateful that you are able to give.", "Gratitude requires that we live in the present.", "Warmth is the vital element for the growing plant and for the soul of the child."]}, "speak": [{"q": "Who is one person you have never properly thanked? What would you say to them?", "start": "I have never properly thanked ___. I would tell them, “Thank you for…”"}, {"q": "Mother Teresa said loneliness is a kind of poverty. Do you see this kind of poverty in Taiwan? Give an example.", "start": "I think… For example, many people…"}, {"q": "Try the 60-second experiment right now. How many seconds were really “in the now”? What pulled you away?", "start": "I managed about ___ seconds. My mind kept going back to…"}], "stats": {"words": 737, "dist": {"0": 3.0, "1": 77.1, "2": 9.2, "3": 3.3, "4": 5.4, "5": 1.1, "6": 0.9}}, "paras": [{"en": "Grandfather remarked that the really powerful people are the most modest and the most thankful.", "zh": "爺爺說，真正有力的人最謙虛且最懂得感恩。"}, {"en": "I often feel totally humbled in the face of the experience of other people. The other day, I had the opportunity to have lunch with a group of educators. They were a diverse lot and included a math teacher, a violin teacher, an English teacher, etc. I, quite naturally, struck up a conversation with the language teacher. She had recently volunteered at the Missionaries of Charity in Calcutta. Mother Teresa (1910-1997) was the founder and the driving force behind its worldwide expansion. The young woman in the restaurant expressed great gratitude that she had had the opportunity to go and actually give of her time and her energy in the service of others.", "zh": "其他人豐富的閱歷經常讓我感到自己的渺小。一天，我有幸與一群教育工作者共進午餐，這群教育工作者來自不同的專業背景，有數學老師、小提琴老師和英文老師等等，而我自然而然地就與那位英文老師聊了起來。她最近在印度加爾各答的仁愛傳教女修會擔任志工。這個組織的創辦人是德蕾莎修女（1910-1997），她是促成該組織向國際發展的重要推手。用餐時，這位年輕的女老師表示她很感激能有機會到該組織當志工，並且投入時間與精力來服務他人。"}, {"en": "She was expressing a unique form of gratitude: the knowledge that gratitude is based on the realization that the self gains wisdom by giving to others. This giving is unique because to be pure, it must be unconditional: it asks for nothing in return. As Mother Teresa apprises us, the greatest disease in the Western world is not some chronic or fatal physical malady, it is psychological isolation. Many people feel alone and rejected because they experience being unloved. We can pursue material wealth, purchase a large house or a sleek sports car, but this does not alter our isolation. She tells us that this is a unique type of poverty, a poverty of spirituality -- a poverty of the soul if you will. In the East, people are much more inclined to accept the art of conversation and the value of spending time with family and friends. This is a radically different concept relative to the value of life in the West.", "zh": "特別的是，她對於能為他人服務感到感恩，因為她知道在付出的過程中能夠增長智慧。同時，無條件且不求回報地付出，這樣的動機才是無雜染的，這也正是這種無私奉獻的特別之處。德蕾莎修女說，西方世界最可怕的疾病並非慢性病或絕症，而是孤寂感。很多人因為覺得自己沒人愛而感到孤單、被冷落。我們可以追求物質上的財富，買一棟豪宅或酷炫的跑車，但是這並不會改變人們孤單的事實。她說這種孤寂感是一種精神與靈性上的貧乏。在東方，人們比較願意與他人對話，也較重視與家人朋友相處的時間，這與西方的生命價值觀可謂大相逕庭。"}, {"en": "Eckhart Tolle (b. 1948), the Canadian/German philosopher, remarks: “Most humans are never fully present in the now, because unconsciously they believe that the next moment must be more important than this one. But then you miss your whole life, which is never not now.” An appreciation of just being alive, the “I think and therefore I am” of Rene Descartes (1596-1650), and your deep love for the people around you means that these two concepts are inextricably linked: both are unconditional. You must learn to truly love yourself. When you give love unconditionally, you are simply grateful that you are able to give. When your mother embraces you, she is grateful that you have grown into a healthy and vibrant human being, she is not (or should not be) expecting something in return.", "zh": "德國出生的加拿大籍哲學家艾克哈特．托勒（1948-）說：「大部分的人從未全心全意地活在當下，潛意識總會認為下一刻比此刻來得重要，結果就這麼虛度了一生，因為人的一生就是由許多當下所組成的。」感恩自己能夠活著（即笛卡兒的「我思故我在」），並且感恩自己還有能力愛身邊的人，這兩者的關係密不可分，都是建立在無條件的前提之下。若你能無私地給予他人愛，你會對於自己有能力付出而感到感恩，這是真正愛自己的方式，也是我們必須學習做到的。當媽媽擁抱孩子時，她的心中不會（也不該）期望孩子能夠有所回報。相反的，她內心會充滿感激之情，欣慰孩子已長成一個健康且有活力的人。"}, {"en": "The practice of gratitude, however, is not easy for we constantly live in the past or in the future, while gratitude requires that we exist in the present: “in the now,” to quote our above mentioned philosopher. Try this experiment: “Be in the present” for 60 seconds. Sit in a quiet place and focus on your breathing, empty your mind and contemplate the moment. When I initially tried this, of my 60 seconds, only 15 were actually free and uncorrupted with other thoughts. It requires practice, I am told.", "zh": "然而，練習感恩對於我們而言並不容易，因為我們經常活在過去或未來。想要有一顆感恩的心，套句托勒的話，我們就必須活在當下。你可以做個小實驗，試著專注於當下，並持續60秒的時間。你可以坐在一個安靜的地方，把注意力放在呼吸，清空思緒，並開始冥想。剛開始這樣練習時，我只能堅持15秒，只有這15秒能自在地控制內心不去想其他事情。就我所知，這是需要練習的。"}, {"en": "I believe that to really be grateful, I must acknowledge that I am unique and I have special gifts to give the world. With this, I ought to come to the realization that I am not a wage slave if I do not want to be. Work is a concept about extending yourself away from yourself on some type of concrete project: that could be intellectual work or physical work. Whatever task it is, once again, your efforts must be 100% or not done at all because you damage yourself if you do something halfway. You know yourself, if you step into something and it is a \"good-enough job,\" that is what it appears.", "zh": "我認為，想要真正擁有一顆感恩的心，我們要認可每個人都是獨一無二的個體，而且能對這個世界做出貢獻。我們必須體悟，除非你願意，否則沒有人能逼你成為薪水的奴隸。工作的觀念就是將想法付諸行動，去執行某個具體的任務，可能是要動腦的工作或是勞力活。無論是什麼工作，你都必須付出全部的努力，不然就乾脆不要做，因為做事半吊子的態度對你有害。你知道，如果你做事只是抱持馬馬虎虎的態度，那麼你就會深受其害。"}, {"en": "And I ask myself, because I'm an old man now, \"Do I want to live a good-enough life?\" And if the answer is \"yes,\" tragic! Look at society: there are millions of examples of people who live good-enough lives. We do not have to, especially when we are young, especially when we do not have to become wage slaves. The great psychiatrist and philosopher Carl Jung (1875-1961) has a thought: One looks back with appreciation to the brilliant teachers, but with gratitude to those who touched our human feelings. The curriculum is so much necessary raw material, but warmth is the vital element for the growing plant and for the soul of the child.", "zh": "現在我年紀大了，我會問自己是否想過「差不多」的人生？如果答案是想的話，那就悲哀了！看看我們的社會，有幾百萬人正庸庸碌碌地在過日子。我們不用像他們一樣。在我們還年輕、還不須為五斗米折腰的時候，我們更有權利選擇不過這種生活。偉大的精神科醫師兼哲學家榮格（1875-1961）認為：「想起以前那些很會教的老師，我們會心懷敬意，但是對於曾經觸動我們內心的好老師，我們會滿懷感激。學校的課程對我們的學習而言只是基本的要素，溫暖才是讓植物生長，讓孩子心靈提升的關鍵要素。」"}]}, {"id": "fear", "piece": 11, "title_en": "Fear", "title_zh": "恐懼", "idea_en": "My fears, my apprehensions, my joys and my state of euphoria are mine to choose.", "idea_zh": "恐懼、憂慮、喜悅與狂喜，都是我能自己選擇的。", "quote": {"en": "In human intercourse the tragedy begins, not when there is misunderstanding about words, but when silence is not understood.", "who": "Henry David Thoreau (1817–1862), author and poet"}, "glossary": [{"f": ["superstition"], "lemma": "superstition", "pos": "n.", "zh": "迷信", "lv": 5, "en": "a belief in luck or magic that is not based on reason or science", "ex": "Grandfather believed that superstition has no place in the present."}, {"f": ["boogeyman"], "lemma": "boogeyman", "pos": "n.", "zh": "（嚇小孩的）妖怪", "lv": 0, "en": "an imaginary monster used to frighten children", "ex": "The boogeyman is not everywhere!"}, {"f": ["self-contained"], "lemma": "self-contained", "pos": "adj.", "zh": "自成一體的；不假外求的", "lv": 0, "en": "complete in itself; not needing help or anything from outside", "ex": "The beauty of being alive is that everything is self-contained: He told me, “My fears, my apprehensions, my joys and my state of euphoria are mine to choose."}, {"f": ["apprehensions"], "lemma": "apprehension", "pos": "n.", "zh": "憂慮；不安", "lv": 0, "en": "worry or fear that something bad will happen", "ex": "The beauty of being alive is that everything is self-contained: He told me, “My fears, my apprehensions, my joys and my state of euphoria are mine to choose."}, {"f": ["euphoria"], "lemma": "euphoria", "pos": "n.", "zh": "極度興奮；狂喜", "lv": 0, "en": "a feeling of great happiness and excitement", "ex": "The beauty of being alive is that everything is self-contained: He told me, “My fears, my apprehensions, my joys and my state of euphoria are mine to choose."}, {"f": ["commitment"], "lemma": "commitment", "pos": "n.", "zh": "投入；堅持", "lv": 5, "en": "a willingness to give your time and energy to something you believe in", "ex": "To achieve happiness, however, requires personal effort and commitment.”"}, {"f": ["arguably"], "lemma": "arguably", "pos": "adv.", "zh": "可以說；大概", "lv": 0, "en": "used to say that something may well be true, and you could give reasons for it", "ex": "As human beings, our most important senses, arguably, are our sense of sight and our sense of hearing; when either of these is stifled, we feel “ill at ease,”"}, {"f": ["stifled"], "lemma": "stifle", "pos": "v.", "zh": "壓抑；使窒息", "lv": 0, "en": "to stop something from developing or being expressed", "ex": "As human beings, our most important senses, arguably, are our sense of sight and our sense of hearing; when either of these is stifled, we feel “ill at ease,”"}, {"f": ["ill at ease"], "lemma": "ill at ease", "pos": "phr.", "zh": "不自在；不安", "lv": 0, "en": "feeling uncomfortable or nervous", "ex": "As human beings, our most important senses, arguably, are our sense of sight and our sense of hearing; when either of these is stifled, we feel “ill at ease,”"}, {"f": ["pollution"], "lemma": "pollution", "pos": "n.", "zh": "污染", "lv": 3, "en": "harmful or dirty substances in the air, water, or land", "ex": "Most of us now live in a world filled with light: light pollution is rather the norm than the exception."}, {"f": ["norm"], "lemma": "norm", "pos": "n.", "zh": "常態；常規", "lv": 5, "en": "what is usual, normal, or expected", "ex": "Most of us now live in a world filled with light: light pollution is rather the norm than the exception."}, {"f": ["concomitant"], "lemma": "concomitant", "pos": "adj.", "zh": "伴隨的；同時發生的", "lv": 0, "en": "happening together with something else, often as a result of it", "ex": "Our historical fear of the dark grew in a concomitant relationship to the expansion of light: the fire, the torch, the lighted street lamp, etc."}, {"f": ["torch"], "lemma": "torch", "pos": "n.", "zh": "火把", "lv": 5, "en": "a stick with fire at one end, used for light", "ex": "Our historical fear of the dark grew in a concomitant relationship to the expansion of light: the fire, the torch, the lighted street lamp, etc."}, {"f": ["impenetrable"], "lemma": "impenetrable", "pos": "adj.", "zh": "穿不透的；難以理解的", "lv": 0, "en": "impossible to see through or get through; also, impossible to understand", "ex": "The endlessness of the impenetrable forest or the indigo black of the baffling ocean were unfathomable and foreboding to most people: Hence, our traditional fear of the dark."}, {"f": ["baffling"], "lemma": "baffle", "pos": "adj.", "zh": "令人困惑的", "lv": 0, "en": "(baffling) impossible to understand or explain", "ex": "The endlessness of the impenetrable forest or the indigo black of the baffling ocean were unfathomable and foreboding to most people: Hence, our traditional fear of the dark."}, {"f": ["unfathomable"], "lemma": "unfathomable", "pos": "adj.", "zh": "深不可測的", "lv": 0, "en": "too deep or too strange to be understood", "ex": "The endlessness of the impenetrable forest or the indigo black of the baffling ocean were unfathomable and foreboding to most people: Hence, our traditional fear of the dark."}, {"f": ["foreboding"], "lemma": "foreboding", "pos": "adj.", "zh": "不祥的", "lv": 0, "en": "giving a feeling that something bad is going to happen", "ex": "The endlessness of the impenetrable forest or the indigo black of the baffling ocean were unfathomable and foreboding to most people: Hence, our traditional fear of the dark."}, {"f": ["goblins"], "lemma": "goblin", "pos": "n.", "zh": "小妖精", "lv": 0, "en": "a small, ugly, and often evil creature in stories", "ex": "It then became very easy to add on the ghosts and goblins that we associate with the night, nature’s nocturnal sounds only lending credence to their reality."}, {"f": ["nocturnal"], "lemma": "nocturnal", "pos": "adj.", "zh": "夜間的", "lv": 0, "en": "happening or active at night", "ex": "It then became very easy to add on the ghosts and goblins that we associate with the night, nature’s nocturnal sounds only lending credence to their reality."}, {"f": ["credence"], "lemma": "credence", "pos": "n.", "zh": "可信度；相信", "lv": 0, "en": "belief that something is true", "ex": "It then became very easy to add on the ghosts and goblins that we associate with the night, nature’s nocturnal sounds only lending credence to their reality."}, {"f": ["infamous"], "lemma": "infamous", "pos": "adj.", "zh": "惡名昭彰的", "lv": 0, "en": "well known for something bad", "ex": "One of the more infamous episodes in the modern Western narrative is the misogynistic Salem Witch Trials between 1692 and 1693."}, {"f": ["episodes"], "lemma": "episode", "pos": "n.", "zh": "（一段）事件；插曲", "lv": 5, "en": "a single event or period of time that is different from what comes before and after", "ex": "One of the more infamous episodes in the modern Western narrative is the misogynistic Salem Witch Trials between 1692 and 1693."}, {"f": ["narrative"], "lemma": "narrative", "pos": "n.", "zh": "敘事；歷史敘述", "lv": 5, "en": "a story or a way of telling and explaining events", "ex": "One of the more infamous episodes in the modern Western narrative is the misogynistic Salem Witch Trials between 1692 and 1693."}, {"f": ["misogynistic"], "lemma": "misogynistic", "pos": "adj.", "zh": "厭女的；貶抑女性的", "lv": 0, "en": "showing hatred of women or the belief that women are less important than men", "ex": "One of the more infamous episodes in the modern Western narrative is the misogynistic Salem Witch Trials between 1692 and 1693."}, {"f": ["threatened"], "lemma": "threaten", "pos": "adj.", "zh": "感到威脅的", "lv": 3, "en": "(threatened) feeling that you are in danger or under attack", "ex": "The people in power and the religious leaders felt threatened by this change."}, {"f": ["hysteria"], "lemma": "hysteria", "pos": "n.", "zh": "歇斯底里；集體恐慌", "lv": 0, "en": "extreme fear or excitement that people cannot control, often spreading through a group", "ex": "The Salem case is thought to be one of mass hysteria."}, {"f": ["minorities"], "lemma": "minority", "pos": "n.", "zh": "少數族群", "lv": 2, "en": "a smaller group of people who are different in race, religion, or culture from most people in a country", "ex": "Throughout history, minorities have been controlled in similar ways."}, {"f": ["vilified"], "lemma": "vilify", "pos": "v.", "zh": "醜化；詆毀", "lv": 0, "en": "to say or write unfair, very bad things about someone so that others think badly of them", "ex": "Jews, Romani people, blacks and the Chinese have been vilified and dominated through misinformation and suspicion."}, {"f": ["misinformation"], "lemma": "misinformation", "pos": "n.", "zh": "錯誤訊息；假訊息", "lv": 0, "base": "information", "base_lv": 3, "en": "false or incorrect information, often spread without care", "ex": "Jews, Romani people, blacks and the Chinese have been vilified and dominated through misinformation and suspicion."}, {"f": ["suspicion"], "lemma": "suspicion", "pos": "n.", "zh": "猜疑；懷疑", "lv": 3, "en": "a feeling that someone may be guilty or cannot be trusted", "ex": "Jews, Romani people, blacks and the Chinese have been vilified and dominated through misinformation and suspicion."}, {"f": ["integrate"], "lemma": "integrate", "pos": "v.", "zh": "使融入；整合", "lv": 5, "en": "to become, or help someone become, a full part of a group or society", "ex": "The modern world must intelligently learn to explain and integrate a given minority without threatening the majority."}, {"f": ["utilized"], "lemma": "utilize", "pos": "v.", "zh": "利用；運用", "lv": 5, "en": "to use something for a practical purpose", "ex": "This is a political artform that is not fully understood or utilized."}, {"f": ["dispel"], "lemma": "dispel", "pos": "v.", "zh": "消除；驅散", "lv": 0, "en": "to make a feeling or belief go away", "ex": "The challenge remains: how do you dispel long accepted racial biases or historical myths?"}, {"f": ["biases"], "lemma": "bias", "pos": "n.", "zh": "偏見", "lv": 5, "en": "an unfair feeling for or against a person or group", "ex": "The challenge remains: how do you dispel long accepted racial biases or historical myths?"}, {"f": ["myths"], "lemma": "myth", "pos": "n.", "zh": "迷思；神話", "lv": 5, "en": "an idea or story that many people believe but that is not true", "ex": "The challenge remains: how do you dispel long accepted racial biases or historical myths?"}, {"f": ["requisite"], "lemma": "requisite", "pos": "adj.", "zh": "必需的；照例要有的", "lv": 0, "en": "needed for a particular purpose; also, expected because it always happens", "ex": "As a child, I was also filled with the fear of the dark and my mother left the requisite bedroom lamp on."}, {"f": ["tucked"], "lemma": "tuck", "pos": "v.", "zh": "（把被子）塞好；蓋好", "lv": 6, "en": "to cover someone comfortably in bed by pushing the edges of the blanket under them", "ex": "I recall many a night, however, that I stayed safely tucked in my bed rather than take a chance on being caught by the boogeyman on the way to the bathroom."}, {"f": ["shelter"], "lemma": "shelter", "pos": "n.", "zh": "避難所；防空洞", "lv": 4, "en": "a place that protects people from danger or bad weather", "ex": "It had a bomb shelter in the back garden."}, {"f": ["recollect"], "lemma": "recollect", "pos": "v.", "zh": "回想起", "lv": 0, "en": "to remember something", "ex": "I recollect almost beating my friend, Terry, senseless because, when we were in the structure playing hide and seek, he made ghoulish sounds that terrified me."}, {"f": ["ghoulish"], "lemma": "ghoulish", "pos": "adj.", "zh": "陰森恐怖的", "lv": 0, "en": "strange and frightening, connected with death or evil spirits", "ex": "I recollect almost beating my friend, Terry, senseless because, when we were in the structure playing hide and seek, he made ghoulish sounds that terrified me."}, {"f": ["endorsement"], "lemma": "endorsement", "pos": "n.", "zh": "認可；支持", "lv": 5, "en": "approval or support for someone or something", "ex": "I was extremely shy and hoping for that sign of endorsement of our relationship that everyone expects from their parents."}, {"f": ["flummoxed"], "lemma": "flummox", "pos": "adj.", "zh": "完全搞不懂的；困惑的", "lv": 0, "en": "(flummoxed) completely confused; not knowing what to do or say", "ex": "I was totally flummoxed."}, {"f": ["inquired"], "lemma": "inquire", "pos": "v.", "zh": "詢問", "lv": 6, "en": "to ask for information", "ex": "I inquired, rather sheepishly?"}, {"f": ["sheepishly"], "lemma": "sheepishly", "pos": "adv.", "zh": "怯生生地；不好意思地", "lv": 0, "en": "in an embarrassed way, because you feel a little silly or guilty", "ex": "I inquired, rather sheepishly?"}, {"f": ["distraught"], "lemma": "distraught", "pos": "adj.", "zh": "心煩意亂的；極度不安的", "lv": 0, "en": "extremely upset and worried", "ex": "my distraught mother replied."}, {"f": ["conservatism"], "lemma": "conservatism", "pos": "n.", "zh": "保守主義；保守風氣", "lv": 0, "base": "conservative", "base_lv": 4, "en": "dislike of change and new ideas; a preference for traditional ways", "ex": "This was the era of the Satanic Bible and Anton LaVey; some kids saw it as power and a break with the conservatism of our society."}, {"f": ["transition"], "lemma": "transition", "pos": "n.", "zh": "轉變；過渡", "lv": 5, "en": "the process of changing from one state or condition to another", "ex": "My first relationship ended rather hastily, to put it mildly, my mother assisting in the transition."}, {"f": ["misunderstanding"], "lemma": "misunderstanding", "pos": "n.", "zh": "誤會", "lv": 4, "en": "a failure to understand something correctly", "ex": "This misunderstanding now seems quite funny, but fifty years ago it was “deathly”"}], "vocab_q": [{"q": "Grandfather believed that ______ has no place in modern life; black cats and broken mirrors cannot hurt you.", "o": ["superstition", "commitment", "endorsement", "transition"], "a": 0, "x": "superstition 迷信。黑貓、破鏡會帶來厄運就是迷信。"}, {"q": "Light ______ is so common in big cities that many children have never seen the Milky Way.", "o": ["pollution", "narrative", "episode", "myth"], "a": 0, "x": "light pollution 光害。原文：light pollution is rather the norm than the exception。"}, {"q": "The modern world must learn to ______ minorities into society without making the majority feel threatened.", "o": ["integrate", "terrify", "inquire", "tuck"], "a": 0, "x": "integrate A into B 使 A 融入 B。原文：explain and integrate a given minority…"}, {"q": "“Why?” I ______ shyly, not understanding what had just happened.", "o": ["inquired", "integrated", "utilized", "terrified"], "a": 0, "x": "inquire 詢問。後面接的是一句問話 “Why?”。"}], "cloze": {"text": "As a child, the author was afraid of the dark, __1__ his mother always left a lamp on in his bedroom. On many nights, he stayed safely in bed __2__ walk to the bathroom and risk meeting the boogeyman. His parents’ house had a bomb shelter in the back garden, built during the Second World War. Once, while the boys __3__ hide-and-seek inside it, his friend Terry made scary sounds. The author was so frightened that he __4__ beat Terry senseless.", "items": [{"o": ["so", "but", "unless", "or"], "a": 0, "x": "怕黑（原因）→ 所以媽媽留燈（結果），用 so。"}, {"o": ["rather than", "as well as", "in order to", "because of"], "a": 0, "x": "寧可待在床上，「而不」起來上廁所 → rather than + 原形動詞。"}, {"o": ["were playing", "have played", "play", "would play"], "a": 0, "x": "while 引導「當時正在進行」的動作，用過去進行式 were playing。"}, {"o": ["almost", "never", "hardly", "already"], "a": 0, "x": "原文：I recollect almost beating my friend… 差一點就把他打昏，用 almost。"}]}, "fill": {"text": "Why are humans afraid of the dark? Sight and hearing are __1__ our most important senses, so when we cannot see or hear clearly, we feel ill at ease. For most of history, the deep forest and the dark ocean were __2__ to most people. It was easy to __3__ ghosts and goblins to the night, and strange __4__ sounds only made them seem more real. Today, however, light pollution is the __5__ rather than the exception.", "options": ["arguably", "mysterious", "add", "nighttime", "norm", "delicious", "quietly", "lend"], "a": [0, 1, 2, 3, 4], "x": ["arguably 可以說；原文 our most important senses, arguably, are…", "were + 形容詞；森林和海洋對人來說「神祕難測」，對應原文 unfathomable。", "add A to B 把 A 加到 B 上；原文 add on the ghosts and goblins。", "形容詞修飾 sounds；原文 nature’s nocturnal sounds。", "the norm rather than the exception 是常態而非例外。"]}, "structure": {"text": "Fear has often been used to control people. __1__ At that time, ordinary people were slowly “waking up” to new possibilities, and the people in power felt threatened by this change. __2__ Throughout history, minorities such as Jews, Romani people, Black people, and Chinese people have been treated in similar ways. __3__", "options": ["One famous example is the Salem Witch Trials of 1692 to 1693.", "The trials were used to control the population, especially women, through fear.", "The challenge today is how to remove long-accepted racial biases and historical myths.", "The author’s first girlfriend said she wanted to be a witch."], "a": [0, 1, 2], "x": ["主題句後先舉例：塞勒姆獵巫案。下一句的 At that time 指的就是這個時期。", "說明審判如何被用來「控制人民」，下一句 in similar ways 才有所指。", "結尾提出今天的挑戰。D 雖然也提到 witch，但屬於作者自己的故事，不在這一段。"]}, "reading": [{"q": "According to Grandfather, feelings such as fear and joy ______.", "o": ["are ours to choose", "are controlled by ghosts", "can never be changed", "come from our parents"], "a": 0, "x": "第 1 段：My fears, my apprehensions, my joys and my state of euphoria are mine to choose."}, {"q": "Why did the author’s mother ask Cindy to leave the house?", "o": ["Cindy was rude to her.", "Cindy said she wanted to be a witch.", "Cindy was too young.", "The author did not have a car."], "a": 1, "x": "第 5 段：“She wants to be a witch,” my distraught mother replied."}, {"q": "How does the author feel about the Cindy incident today?", "o": ["It is still deathly serious.", "It seems quite funny now, though it was serious fifty years ago.", "He thinks it was his own fault.", "He believes Cindy was joking."], "a": 1, "x": "第 6 段：This misunderstanding now seems quite funny, but fifty years ago it was “deathly” serious."}, {"q": "According to Thoreau, when does tragedy begin in human relationships?", "o": ["When people misunderstand each other’s words.", "When silence is not understood.", "When people stop talking.", "When people argue in public."], "a": 1, "x": "篇末引言：…not when there is misunderstanding about words, but when silence is not understood."}], "mixed": [{"q": "Find ONE word in paragraph 5 that means “very upset and worried.” It describes the author’s mother.", "accept": ["distraught"], "x": "“She wants to be a witch,” my distraught mother replied."}, {"q": "Fill in ONE word: When his mother whispered to him, her eyes were enlarged like ______.", "accept": ["saucers"], "x": "her eyes enlarged like saucers（眼睛睜得像茶托一樣大）"}], "translate": [{"zh": "我們的恐懼與喜悅，是我們自己可以選擇的。", "ref": ["Our fears and joys are ours to choose.", "We can choose our own fears and joys."], "tip": "be + 所有格代名詞 + to V：「由…來決定」，例如 The decision is yours to make."}, {"zh": "想要快樂，需要個人的努力與堅持。", "ref": ["To achieve happiness requires personal effort and commitment.", "Being happy takes personal effort and commitment."], "tip": "不定詞片語 To achieve happiness 或動名詞 Being happy 都可以當主詞。"}], "essay": {"prompt_zh": "請寫一篇英文作文，文分兩段。第一段描述你小時候害怕的一件事物，以及當時的情況；第二段說明你後來如何克服（或如何看待）這份恐懼，以及你從中學到了什麼。", "materials": ["As a child, I was filled with the fear of…", "I recall many a night when I…", "It terrified me.", "This now seems quite funny, but at the time it was deathly serious.", "My fears are mine to choose."]}, "speak": [{"q": "What were you afraid of as a child? Are you still afraid of it today?", "start": "When I was little, I was afraid of… Now, …"}, {"q": "Grandfather said our fears and joys are “ours to choose.” Do you agree? Can we really choose not to be afraid?", "start": "I partly agree. On the one hand, … On the other hand, …"}, {"q": "Thoreau says tragedy begins when silence is not understood. Think of a time when silence was misunderstood between friends or family.", "start": "Once, my friend didn’t reply to my message, and I thought… Later I found out…"}], "stats": {"words": 686, "dist": {"0": 6.3, "1": 73.1, "2": 12.2, "3": 3.2, "4": 2.6, "5": 2.2, "6": 0.3}}, "paras": [{"en": "Grandfather believed that superstition has no place in the present. The boogeyman is not everywhere! The beauty of being alive is that everything is self-contained: He told me, “My fears, my apprehensions, my joys and my state of euphoria are mine to choose. I can be the person I want to be. To achieve happiness, however, requires personal effort and commitment.”", "zh": "爺爺認為，迷信在當代社會沒有容身之處，畢竟不是到處都有惡靈啊！活著的美好之處在於你自己能夠決定如何看待一切事物，他告訴我：「恐懼、憂慮、喜悅與狂喜都是我能自己選擇的，我能夠成為自己想要成為的人。但是，想要獲得快樂的話就必須靠自己的努力與堅持。」"}, {"en": "As human beings, our most important senses, arguably, are our sense of sight and our sense of hearing; when either of these is stifled, we feel “ill at ease,” to say the least. Most of us now live in a world filled with light: light pollution is rather the norm than the exception. Our historical fear of the dark grew in a concomitant relationship to the expansion of light: the fire, the torch, the lighted street lamp, etc. The endlessness of the impenetrable forest or the indigo black of the baffling ocean were unfathomable and foreboding to most people: Hence, our traditional fear of the dark. It then became very easy to add on the ghosts and goblins that we associate with the night, nature’s nocturnal sounds only lending credence to their reality.", "zh": "身為人，我們最重要的感官大概就是我們的視覺和聽覺。當我們任何其中一種感官退化時，我們最起碼會感到「不自在」。我們大部分人都生活在燈火通明的地方，對光害問題早已習以為常。隨著火焰、火把和街燈等照明設備的普及，我們對於黑暗的恐懼逐漸擴大。對大部分的人來說，沒有盡頭、穿越不了的森林，或是神祕莫測、暗不見底的海洋不只是難以捉摸，甚至給人不祥的預感，這就是為何我們長期以來對黑暗存在著恐懼。後來，我們將鬼怪與黑暗聯想在一起，夜晚時戶外傳來的聲音讓我們對於鬼怪的存在更是深信不疑。"}, {"en": "Sadly, we have acted on this fear in far too many instances. One of the more infamous episodes in the modern Western narrative is the misogynistic Salem Witch Trials between 1692 and 1693. This was a time when the average person was slowly becoming “awake” to the possibilities available in life. The people in power and the religious leaders felt threatened by this change. The Salem case is thought to be one of mass hysteria. The proceedings were used to, effectively, control the population -- especially its female members -- through fear. Throughout history, minorities have been controlled in similar ways. Jews, Romani people, blacks and the Chinese have been vilified and dominated through misinformation and suspicion. The modern world must intelligently learn to explain and integrate a given minority without threatening the majority. This is a political artform that is not fully understood or utilized. The challenge remains: how do you dispel long accepted racial biases or historical myths?", "zh": "不幸的是，我們任恐懼擺佈的例子不勝枚舉。舉1692年到1693年期間的塞勒姆獵巫事件為例，這個貶抑女性的案子是現代西洋史中一個不光彩的事件。在這個時期，普羅大眾慢慢意識到人生中各種的可能性，而對於這樣的轉變，掌權者與宗教界的領袖備感威脅。塞勒姆審巫案就是一個集體歇斯底里的例子。透過人們對於巫術的恐懼，起訴巫術嫌疑犯成為有效控制人民的方式，尤其是對女性的控制。在整個歷史的進程中，少數民族都被以類似的方式控制著。人們透過散佈不實訊息和製造懸疑的方式來醜化猶太人、吉普賽人（羅姆人）、黑人與中國人。現代社會的人們必須要明智地學習如何在不威脅到主流社會的情況下，將特定少數族群融入社會中。這種操作是一種政治藝術，至今仍未被完全地理解與運用。因此我們依然面臨以下的困境：要如何消除人們根深蒂固的種族偏見或是歷史迷思呢？"}, {"en": "As a child, I was also filled with the fear of the dark and my mother left the requisite bedroom lamp on. I recall many a night, however, that I stayed safely tucked in my bed rather than take a chance on being caught by the boogeyman on the way to the bathroom. My parents owned a home that was built during the Second World War. It had a bomb shelter in the back garden. I recollect almost beating my friend, Terry, senseless because, when we were in the structure playing hide and seek, he made ghoulish sounds that terrified me.", "zh": "小時候我也非常怕黑，所以我媽媽一定都會讓臥房的夜燈亮著。不過我記得有好幾個晚上，我怕冒險起來上廁所會被鬼抓走，所以寧可乖乖地躺在床上比較安全。我爸媽的房子建於二戰期間，這個房子的後花園有個防空洞。我還記得我差一點把我的朋友泰瑞打到不省人事，因為當我們在玩躲貓貓的時候，他發出很可怕的聲音把我嚇得半死。"}, {"en": "My most telling trip down this strange memory lane was with my very first female friend, Cindy Brown: this was quite an accomplishment because she had become my “girl” (not yet girlfriend) and I still didn’t own a car. I took her home to meet my moderately religious mother and father. I was extremely shy and hoping for that sign of endorsement of our relationship that everyone expects from their parents. My mother took Cindy aside and asked her what she wanted to be in the future. In what seemed like seconds, she softly whispered to me -- her eyes enlarged like saucers -- that my girl friend had to leave our home, “immediately.” I was totally flummoxed. “Why,” I inquired, rather sheepishly? “She wants to be a witch,” my distraught mother replied.", "zh": "當我回憶過去這些奇特的經驗時，最鮮明的例子的莫過於我和辛蒂．布朗的故事了。她是我第一個「女生朋友」，為此我非常得意，因為當時我還沒有車，她卻已經「屬於我」了（只是還不算是女朋友）。我的父母是有信仰的人（天主教），而就跟大家一樣，我很希望我和辛蒂能夠受到父母的認可，所以害羞的我便還是帶辛蒂回去見他們。我媽媽把辛蒂拉到一邊，問她未來想要做什麼。才沒多久，我媽媽就湊到我耳邊，眼睛睜得跟茶托一樣大，並小聲地告訴我辛蒂必須「馬上」離開我們家。我當時十分不知所措，我怯懦地問了一聲：「為什麼？」我媽媽憂心忡忡地答道：「因為她想要成為女巫。」"}, {"en": "This was the era of the Satanic Bible and Anton LaVey; some kids saw it as power and a break with the conservatism of our society. This was all news to me: Cindy and I had never discussed this concept before. My first relationship ended rather hastily, to put it mildly, my mother assisting in the transition. This misunderstanding now seems quite funny, but fifty years ago it was “deathly” serious. The author, poet and transcendentalist, Henry David Thoreau (1817-1862), has a thought: In human intercourse the tragedy begins, not when there is misunderstanding about words, but when silence is not understood.", "zh": "當時剛好是撒旦聖經與安東．拉維的時代，有些小孩認為這個宗教賦予他們權力，是他們逃離保守社會的一個出口。我壓根不知道辛蒂有這種想法，我們之前從沒討論過這個主題。就這樣，我的第一段感情草草地結束了，這是比較保守的說法，實際上是我媽媽立刻幫我畫下了句點。現在回頭看，當時對辛蒂的誤解顯得非常可笑，但是在五十年前，這可是一件大事。身兼作家、詩人與超驗主義者的梭羅（Henry David Thoreau）認為：「悲劇的發生並不是因為人們在互動時誤解彼此說的話，而是因為不了解沉默所代表的意涵。」"}]}];
