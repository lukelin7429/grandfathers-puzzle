  <p class="legend">亮起來的是原型開放的 3 片；其餘 27 片之後陸續加入。</p>
  <div class="units">${cards}</div>
  <div class="howto">
    <div class="eyebrow">每一片怎麼用</div>
    <ol>
      <li><b>閱讀</b>：中英對照讀原文，點底線的字看級別與意思。</li>
      <li><b>單字</b>：大考範圍內的字做成字卡；超出範圍的字看懂就好。</li>
      <li><b>題型</b>：詞彙、綜合測驗、文意選填、篇章結構、閱讀測驗、混合題，作答馬上看解析。</li>
      <li><b>寫作</b>：中譯英兩題，加一篇兩段式英文作文，書裡的句子可以直接拿來用。</li>
      <li><b>口說</b>：Leon 上課的方法：自己想、跟同學說、再說給全班聽。</li>
    </ol>
  </div>
  ${foot()}`;
}
function distBar(u){
  const d=u.stats.dist, seg=[["1","var(--line)"],["2","var(--line)"],["3","var(--line)"],["4","var(--l4)"],["5","var(--l5)"],["6","var(--l6)"],["0","var(--off)"]];
  const hard=((d["4"]||0)+(d["5"]||0)+(d["6"]||0)).toFixed(1), off=(d["0"]||0).toFixed(1);
  return `<div class="dist" aria-hidden="true">${seg.map(([k,c])=>`<i style="width:${d[k]||0}%;background:${c}"></i>`).join("")}</div>
  <div class="meta" style="margin-top:6px"><span>第 1–3 級 ${((d["1"]||0)+(d["2"]||0)+(d["3"]||0)).toFixed(0)}%</span><span class="k4">第 4–6 級 ${hard}%</span><span class="k0">範圍外 ${off}%</span></div>`;
}
function foot(){return `<footer>
  <div>原型版本（2026 年 11 月，新增英英解釋）｜原文與中譯：《Grandfather Is Dead 夜幕低垂：爺爺的30片拼圖》，Leon E. La Couvée 著，林吉祥 譯。</div>
  <div>詞彙級別依大學入學考試中心《高中英文參考詞彙表（111 學年度起適用）》比對；題目為依原文改寫的學測題型練習，非大考中心試題。</div>
  <div>作答紀錄只存在這台裝置的瀏覽器裡。</div>
  <div class="guide-link"><a href="guide.html">Teacher’s guide (English) ／ 使用說明</a></div></footer>`}

/* ---------------- unit ---------------- */
function progress(u){
  const a=store.get("ans-"+u.id,{});
  const total=u.vocab_q.length+u.cloze.items.length+u.fill.a.length+u.structure.a.length+u.reading.length+u.mixed.length;
  let correct=0,done=0;
  for(const k in a){done++; if(a[k].ok) correct++;}
  return {total,correct,done};
}
function unit(u){
  document.title=`${u.title_en} · 爺爺的拼圖英文課`;
  const tabs=[["read","閱讀"],["vocab","單字"],["practice","題型"],["write","寫作"],["speak","口說"]];
  app.innerHTML=`
  <div class="topbar">
    <div class="crumbs"><a href="#">← 30 片拼圖</a><span class="muted">Piece ${u.piece} / 30</span></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div>
  </div>
  <div class="uhead">
    <div class="eyebrow">Piece Number ${u.piece}</div>
    <h1>${esc(u.title_en)}<span class="zh">${esc(u.title_zh)}</span></h1>
    <div class="idea-box"><div class="en">${esc(u.idea_en)}</div><div class="zh">${esc(u.idea_zh)}</div></div>
  </div>
  <div id="panel"></div>
  ${foot()}`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;store.set("tab",state.tab);unit(u);window.scrollTo({top:0})});
  ({read:readTab,vocab:vocabTab,practice:practiceTab,write:writeTab,speak:speakTab}[state.tab]||readTab)(u,$("#panel"));
}

/* reading */
function markup(text,u){
  const forms=[];u.glossary.forEach((g,i)=>g.f.forEach(f=>forms.push([f,i])));
  forms.sort((a,b)=>b[0].length-a[0].length);
  const re=new RegExp("\\b("+forms.map(f=>f[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
  const idx={};forms.forEach(([f,i])=>idx[f.toLowerCase()]=i);
  return esc(text).replace(re,m=>{const i=idx[m.toLowerCase()];const g=u.glossary[i];
    return `<button class="w ${lvClass(g)}" data-g="${i}">${m}</button>`});
}
function readTab(u,el){
  el.innerHTML=`<section class="panel">
    <div class="chips">
      <button class="chip" id="tgZh" aria-pressed="${state.zh}">中英對照</button>
      <button class="chip" id="tgMk" aria-pressed="${state.marks}">標示重點字</button>
    </div>
    <div class="key"><span class="k k4">第 4 級</span><span class="k k5">第 5 級</span><span class="k k6">第 6 級</span><span class="k k0">範圍外</span><span>點一下字看意思</span></div>
    <div id="text" class="${state.zh?"":"hide-zh"} ${state.marks?"marks":""}">
      ${u.paras.map((p,i)=>`<div class="para ${i===0?"sub":""}"><div class="en">${markup(p.en,u)}</div><div class="zh">${esc(p.zh)}</div></div>`).join("")}
    </div>
    <div class="quote"><div class="eyebrow">篇末名言</div><div class="en">“${esc(u.quote.en)}”</div><div class="who">— ${esc(u.quote.who)}</div></div>
  </section>`;
  $("#tgZh").onclick=()=>{state.zh=!state.zh;store.set("zh",state.zh);readTab(u,el)};
  $("#tgMk").onclick=()=>{state.marks=!state.marks;store.set("marks",state.marks);readTab(u,el)};
  el.querySelectorAll(".w").forEach(b=>b.onclick=e=>{e.stopPropagation();showWord(u.glossary[+b.dataset.g])});
}
function showWord(g){
  const col=LVCOL[g.lv>=4?g.lv:(g.lv===0?0:4)]||"var(--muted)";
  $("#sheetCard").innerHTML=`<div class="row"><span class="word en">${esc(g.lemma)}</span><button class="x" id="sx" aria-label="關閉">×</button></div>
    <div><span class="tag" style="color:${col}">${lvLabel(g)}</span><span class="tag muted">${esc(g.pos)}</span></div>
    <div class="def">${esc(g.en)}</div>
    <div class="zh" style="font-size:15px">${esc(g.zh)}</div>
    <div class="muted" style="font-size:13px">${mustLearn(g)?"大考範圍內，建議背起來。":"看懂就好，不必背。"}</div>`;
  $("#sheet").hidden=false;$("#sx").onclick=hideSheet;$("#sx").focus();
}
function exMark(g){let s=esc(g.ex);g.f.forEach(f=>{s=s.replace(new RegExp("\\b("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","i"),"<b>$1</b>")});return s}
function hideSheet(){$("#sheet").hidden=true}
document.addEventListener("click",e=>{if(!$("#sheet").hidden&&!e.target.closest("#sheetCard"))hideSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideSheet()});

/* vocab */
function vocabTab(u,el){
  const known=store.get("known-"+u.id,{});
  const learn=u.glossary.filter(mustLearn).sort((a,b)=>b.lv-a.lv);
  const off=u.glossary.filter(g=>!mustLearn(g));
  const back=store.get("back","both");
  const n=learn.filter(g=>known[g.lemma]).length;
  el.innerHTML=`<section class="panel">
    <div class="row" style="justify-content:space-between"><h3>要背的字 <small class="muted" style="font-weight:400">大考範圍內，${learn.length} 個</small></h3><span class="muted" style="font-size:13px">已會 ${n} / ${learn.length}</span></div>
    <p class="muted" style="margin:0;font-size:13.5px">先看英文想意思，點卡片翻面；會了就按「我會了」。背面有英英解釋和書中原句。</p>
    <div class="row" role="group" aria-label="背面顯示" style="flex-wrap:wrap;gap:6px"><span class="muted" style="font-size:13px">背面顯示：</span>${[["both","英英＋中文"],["en","只看英英"],["zh","只看中文"]].map(([k,l])=>`<button class="chip" data-back="${k}" aria-pressed="${back===k}">${l}</button>`).join("")}</div>
    <div class="vgrid">${learn.map((g,i)=>`<div class="vcard ${known[g.lemma]?"known":""}">
       <button class="w en" style="text-align:left" data-flip="${i}">${esc(g.lemma)}</button>
       <span class="lvl" style="color:${LVCOL[g.lv]||"var(--muted)"}">第 ${g.lv} 級 · ${esc(g.pos)}</span>
       <div class="back" id="bk${i}" hidden>${back!=="zh"?`<div class="def">${esc(g.en)}</div>`:""}${back!=="en"?`<div class="zh">${esc(g.zh)}</div>`:""}${g.ex?`<div class="ex">${exMark(g)}</div>`:""}</div>
       <div class="row"><button class="chip" data-flip="${i}">翻面</button><button class="chip" data-k="${i}" aria-pressed="${!!known[g.lemma]}">我會了</button></div></div>`).join("")}</div>
    <h3 style="margin-top:10px">看懂就好 <small class="muted" style="font-weight:400">超出大考範圍，${off.length} 個</small></h3>
    <ul class="offlist">${off.map(g=>`<li><span class="en">${esc(g.lemma)}</span><span class="zh">${esc(g.zh)}</span><div class="def">${esc(g.en)}</div>${g.base?`<div class="muted" style="font-size:12px">由 ${esc(g.base)}（第 ${g.base_lv} 級）變化而來</div>`:""}</li>`).join("")}</ul>
  </section>`;
  el.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{store.set("back",b.dataset.back);vocabTab(u,el)});
  el.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{const s=$("#bk"+b.dataset.flip);s.hidden=!s.hidden});
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const g=learn[+b.dataset.k];known[g.lemma]=!known[g.lemma];store.set("known-"+u.id,known);vocabTab(u,el)});
}

/* practice */
function practiceTab(u,el){
  const ans=store.get("ans-"+u.id,{});
  const save=()=>{store.set("ans-"+u.id,ans);};
  const p=progress(u);
  const mcq=(key,stem,opts,a,x,num)=>{
    const r=ans[key];
    return `<div class="q" data-key="${key}">
      <div class="stem"><span class="n">${num}</span>${stem}</div>
      <div class="opts ${opts.some(o=>o.length>30)?"long":""}">${opts.map((o,i)=>{let c="";if(r){if(i===a)c="ok";else if(i===r.v)c="bad";}
        return `<button class="opt ${c}" data-v="${i}" ${r?"disabled":""}><span class="L">(${LET[i]})</span><span>${esc(o)}</span></button>`}).join("")}</div>
      ${r?`<div class="why ${r.ok?"ok":"bad"}">${r.ok?"答對了。":`正解是 (${LET[a]})。`}${esc(x)}</div>`:""}
    </div>`};
  const blankify=(t,prefix)=>esc(t).replace(/__(\d)__/g,(m,n)=>{const r=ans[prefix+(n-1)];return `<span class="blank ${r?(r.ok?"ok":"bad"):""}">${n}</span>`});
  const pickGroup=(prefix,sec,optsList,label)=>{
    const done=sec.a.every((_,i)=>ans[prefix+i]);
    return `<div class="picks">${sec.a.map((a,i)=>{const r=ans[prefix+i];
      return `<div class="pick"><label for="${prefix}${i}">第 ${i+1} 格</label>
        <select id="${prefix}${i}" ${done?"disabled":""}><option value="">請選擇</option>${optsList.map((o,j)=>`<option value="${j}" ${r&&r.v===j?"selected":""}>(${LET[j]}) ${esc(label(o))}</option>`).join("")}</select>
        ${r?`<span class="why ${r.ok?"ok":"bad"}" style="flex-basis:100%">${r.ok?"答對。":`正解 (${LET[a]})。`}${esc(sec.x[i])}</span>`:""}</div>`}).join("")}
      ${done?"":`<div><button class="btn" data-check="${prefix}">對答案</button></div>`}</div>`};
  el.innerHTML=`<section class="panel">
    <div class="score"><span>得分 <b>${p.correct}</b> / ${p.total}</span><span class="muted">已作答 ${p.done} 題</span><button class="btn ghost" id="reset" style="margin-left:auto">重新作答</button></div>

    <div class="qsec"><h3>一、詞彙題 <small>選出最適合填入空格的字</small></h3>
      ${u.vocab_q.map((q,i)=>mcq("v"+i,esc(q.q),q.o,q.a,q.x,i+1+".")).join("")}</div>

    <div class="qsec"><h3>二、綜合測驗 <small>依原文改寫的短文，選出最適合的答案</small></h3>
      <div class="passage en">${blankify(u.cloze.text,"c")}</div>
      ${u.cloze.items.map((q,i)=>mcq("c"+i,"",q.o,q.a,q.x,`第 ${i+1} 格`)).join("")}</div>

    <div class="qsec"><h3>三、文意選填 <small>從 (A)–(H) 選出最適合的字，每個字只能用一次</small></h3>
      <div class="passage en">${blankify(u.fill.text,"f")}</div>
      <ul class="bank">${u.fill.options.map((o,j)=>`<li><span class="L">(${LET[j]})</span>${esc(o)}</li>`).join("")}</ul>
      ${pickGroup("f",u.fill,u.fill.options,o=>o)}</div>

    <div class="qsec"><h3>四、篇章結構 <small>選出最適合的句子放回空格，有一句用不到</small></h3>
      <div class="passage en">${blankify(u.structure.text,"s")}</div>
      <ul class="bank sent">${u.structure.options.map((o,j)=>`<li><span class="L">(${LET[j]})</span>${esc(o)}</li>`).join("")}</ul>
      ${pickGroup("s",u.structure,u.structure.options,o=>o.length>48?o.slice(0,46)+"…":o)}</div>

    <div class="qsec"><h3>五、閱讀測驗 <small>依「閱讀」分頁的原文作答</small></h3>
      ${u.reading.map((q,i)=>mcq("r"+i,esc(q.q),q.o,q.a,q.x,i+1+".")).join("")}</div>

    <div class="qsec"><h3>六、混合題 <small>依原文填入英文，大小寫不拘</small></h3>
      ${u.mixed.map((q,i)=>{const r=ans["m"+i];return `<div class="q"><div class="stem"><span class="n">${i+1}.</span>${esc(q.q)}</div>
        <div class="row"><input type="text" id="mx${i}" value="${r?esc(r.v):""}" ${r?"disabled":""} autocomplete="off" aria-label="第 ${i+1} 題答案">${r?"":`<button class="btn" data-mx="${i}">檢查</button>`}</div>
        ${r?`<div class="why ${r.ok?"ok":"bad"}">${r.ok?"答對了。":`參考答案：${esc(q.accept[0])}。`}${esc(q.x)}</div>`:""}</div>`}).join("")}</div>
  </section>`;
  el.querySelectorAll(".q[data-key] .opt").forEach(b=>b.onclick=()=>{
    const key=b.closest(".q").dataset.key, v=+b.dataset.v;
    const src={v:u.vocab_q,c:u.cloze.items,r:u.reading}[key[0]][+key.slice(1)];
    const y=window.scrollY;
    ans[key]={v,ok:v===src.a};save();practiceTab(u,el);window.scrollTo({top:y});
  });
  el.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{
    const pre=b.dataset.check, sec=pre==="f"?u.fill:u.structure;
    const vals=sec.a.map((_,i)=>$("#"+pre+i).value);
    if(vals.some(v=>v==="")){b.textContent="每一格都要選";return}
    const y=window.scrollY;
    vals.forEach((v,i)=>ans[pre+i]={v:+v,ok:+v===sec.a[i]});save();practiceTab(u,el);window.scrollTo({top:y});
  });
  el.querySelectorAll("[data-mx]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mx, raw=$("#mx"+i).value.trim(); if(!raw) return;
    const norm=s=>s.toLowerCase().replace(/[“”"'.,!?]/g,"").replace(/\s+/g," ").trim();
    const y=window.scrollY;
    ans["m"+i]={v:raw,ok:u.mixed[i].accept.some(a=>norm(a)===norm(raw))};save();practiceTab(u,el);window.scrollTo({top:y});
  });
  $("#reset").onclick=()=>{store.set("ans-"+u.id,{});practiceTab(u,el)};
}

/* writing */
function writeTab(u,el){
  const drafts=store.get("draft-"+u.id,{t0:"",t1:"",essay:"",checks:[]});
  const save=()=>store.set("draft-"+u.id,drafts);
  const checks=["內容：兩段都回答了題目要求，有具體的例子","組織：每段有主題句，段落之間有連接","文法句構：時態一致，句子完整","字彙拼字：用到書裡的句型，拼字正確"];
  el.innerHTML=`<section class="panel">
    <div class="qsec"><h3>中譯英 <small>先自己寫，再看參考答案</small></h3>
      ${u.translate.map((t,i)=>`<div class="q"><div class="stem zh" style="font-family:var(--zh);font-size:16.5px"><span class="n">${i+1}.</span>${esc(t.zh)}</div>
        <textarea id="t${i}" rows="2" aria-label="第 ${i+1} 題翻譯">${esc(drafts["t"+i]||"")}</textarea>
        <div><button class="btn ghost" data-ref="${i}">看參考答案</button></div>
        <div class="ref" id="ref${i}" hidden>${t.ref.map(r=>`<div class="en">${esc(r)}</div>`).join("")}<div class="muted" style="font-size:13.5px">${esc(t.tip)}</div></div></div>`).join("")}</div>
    <div class="qsec"><h3>英文作文 <small>文分兩段，建議 120 字以上</small></h3>
      <div class="passage zh" style="font-family:var(--zh);font-size:15.5px">${esc(u.essay.prompt_zh)}</div>
      <div class="muted" style="font-size:13.5px">書裡的句子可以借用，點一下就會加進作文：</div>
      <div class="mats">${u.essay.materials.map((m,i)=>`<button data-mat="${i}">${esc(m)}</button>`).join("")}</div>
      <textarea id="essay" rows="10" aria-label="英文作文">${esc(drafts.essay||"")}</textarea>
      <div class="row muted" style="font-size:13px;justify-content:space-between"><span id="wc"></span><span>草稿會自動存在這台裝置</span></div>
      <div class="checks">${checks.map((c,i)=>`<label><input type="checkbox" id="ck${i}" ${drafts.checks&&drafts.checks[i]?"checked":""}> ${c}</label>`).join("")}</div>
    </div></section>`;
  const wc=()=>{const n=(($("#essay").value.match(/[A-Za-z’']+/g))||[]).length;$("#wc").textContent=`${n} 字${n>=120?"，長度夠了":""}`};wc();
  u.translate.forEach((_,i)=>{$("#t"+i).oninput=e=>{drafts["t"+i]=e.target.value;save()}});
  el.querySelectorAll("[data-ref]").forEach(b=>b.onclick=()=>{const r=$("#ref"+b.dataset.ref);r.hidden=!r.hidden;b.textContent=r.hidden?"看參考答案":"收起參考答案"});
  $("#essay").oninput=e=>{drafts.essay=e.target.value;save();wc()};
  el.querySelectorAll("[data-mat]").forEach(b=>b.onclick=()=>{const t=$("#essay"),m=u.essay.materials[+b.dataset.mat];
    const s=t.selectionStart??t.value.length, pre=t.value.slice(0,s), add=(pre&&!/\s$/.test(pre)?" ":"")+m+" ";
    t.value=pre+add+t.value.slice(s);t.focus();t.selectionStart=t.selectionEnd=s+add.length;drafts.essay=t.value;save();wc()});
  checks.forEach((_,i)=>{$("#ck"+i).onchange=e=>{drafts.checks=drafts.checks||[];drafts.checks[i]=e.target.checked;save()}});
}

/* speaking */
let timerId=null;
function speakTab(u,el){
  el.innerHTML=`<section class="panel">
    <div class="eyebrow">Leon 的上課方式</div>
    <div class="method">
      <div class="step"><b>1 · Think</b><span>自己先想一分鐘，可以寫幾個關鍵字。</span></div>
      <div class="step"><b>2 · Pair</b><span>跟旁邊的同學說兩分鐘，輪流說。</span></div>
      <div class="step"><b>3 · Share</b><span>說給全班聽：“What do you think?”</span></div>
    </div>
    <div class="timer"><span class="t" id="tm" aria-live="polite">1:00</span>
      <button class="btn" data-sec="60">想 1 分鐘</button><button class="btn" data-sec="120">說 2 分鐘</button><button class="btn ghost" id="tstop">停止</button></div>
    ${u.speak.map((s,i)=>`<div class="sq"><div class="eyebrow">Question ${i+1}</div><div class="en">${esc(s.q)}</div><div class="start">${esc(s.start)}</div></div>`).join("")}
  </section>`;
  const tm=$("#tm");const show=n=>tm.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
  el.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{clearInterval(timerId);let n=+b.dataset.sec;show(n);
    timerId=setInterval(()=>{n--;show(Math.max(n,0));if(n<=0){clearInterval(timerId);tm.textContent="時間到";}},1000)});
  $("#tstop").onclick=()=>{clearInterval(timerId);show(60)};
}

/* router */
function route(){
  clearInterval(timerId);hideSheet();
  const id=location.hash.slice(1), u=DATA.find(x=>x.id===id);
  if(u) unit(u); else home();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
route();
</script>
